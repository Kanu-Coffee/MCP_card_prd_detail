name: cardrag-mcp

services:
  mcp:
    image: ${CARDRAG_MCP_IMAGE:-cardrag-mcp:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      - CARDRAG_ENVIRONMENT=${CARDRAG_ENVIRONMENT:-production}
      - CARDRAG_CHANNEL=${CARDRAG_CHANNEL:-stable}
      - CARDRAG_MCP_STATE_DIR=/var/lib/cardrag-mcp
      - CARDRAG_MCP_HOST=0.0.0.0
      - CARDRAG_MCP_PORT=8000
      - CARDRAG_MCP_PUBLIC_BASE_URL=${CARDRAG_MCP_PUBLIC_BASE_URL:-${CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL:?CARDRAG_MCP_PUBLIC_BASE_URL or CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL is required}}
      - CARDRAG_MCP_BEARER_TOKEN
      - CARDRAG_MCP_BEARER_TOKEN_FILE
      - CARDRAG_MCP_UPDATE_INTERVAL_SECONDS=${CARDRAG_MCP_UPDATE_INTERVAL_SECONDS:-300}
      - CARDRAG_MCP_MAX_VECTOR_BYTES=${CARDRAG_MCP_MAX_VECTOR_BYTES:-1073741824}
      - CARDRAG_MCP_MAX_VECTOR_SIDECAR_BYTES=${CARDRAG_MCP_MAX_VECTOR_SIDECAR_BYTES:-17179869184}
      - CARDRAG_MCP_MAX_RESIDENT_VECTOR_BYTES=${CARDRAG_MCP_MAX_RESIDENT_VECTOR_BYTES:-${CARDRAG_MCP_MAX_VECTOR_BYTES:-1073741824}}
      - CARDRAG_MCP_MAX_SERVING_DATABASE_BYTES=${CARDRAG_MCP_MAX_SERVING_DATABASE_BYTES:-34359738368}
      - CARDRAG_MCP_MAX_GENERATION_DOWNLOAD_BYTES=${CARDRAG_MCP_MAX_GENERATION_DOWNLOAD_BYTES:-68719476736}
      - CARDRAG_MCP_MAX_STATE_BYTES=${CARDRAG_MCP_MAX_STATE_BYTES:-137438953472}
      - CARDRAG_MCP_RESERVED_FREE_SPACE_BYTES=${CARDRAG_MCP_RESERVED_FREE_SPACE_BYTES:-2147483648}
      - CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_JOBS=${CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_JOBS:-32}
      - CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_TOTAL_BYTES=${CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_TOTAL_BYTES:-2147483648}
      - CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_ARTIFACT_BYTES=${CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_ARTIFACT_BYTES:-268435456}
      - CARDRAG_MCP_RERANKER_AUDIT_MAX_JOBS=${CARDRAG_MCP_RERANKER_AUDIT_MAX_JOBS:-1024}
      - CARDRAG_MCP_RERANKER_AUDIT_MAX_TOTAL_BYTES=${CARDRAG_MCP_RERANKER_AUDIT_MAX_TOTAL_BYTES:-536870912}
      - CARDRAG_MCP_RERANKER_AUDIT_MAX_ARTIFACT_BYTES=${CARDRAG_MCP_RERANKER_AUDIT_MAX_ARTIFACT_BYTES:-8388608}
      - CARDRAG_MCP_RETAIN_GENERATIONS=${CARDRAG_MCP_RETAIN_GENERATIONS:-2}
      - CARDRAG_MAXIMUM_CANDIDATE_COUNT=${CARDRAG_MAXIMUM_CANDIDATE_COUNT:-250}
      - CARDRAG_MAXIMUM_PDF_BYTES=${CARDRAG_MAXIMUM_PDF_BYTES:-104857600}
      - CARDRAG_EMBEDDING_TIMEOUT_SECONDS=${CARDRAG_EMBEDDING_TIMEOUT_SECONDS:-60}
      - CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES=${CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES:-1048576}
      - CARDRAG_RERANKER_SHADOW_ENABLED=${CARDRAG_RERANKER_SHADOW_ENABLED:-false}
      - CARDRAG_RERANKER_SHADOW_MODEL=${CARDRAG_RERANKER_SHADOW_MODEL:-qwen/qwen3-reranker-8b}
      - CARDRAG_RERANKER_SHADOW_PROVIDER_ID=${CARDRAG_RERANKER_SHADOW_PROVIDER_ID:-fireworks}
      - CARDRAG_RERANKER_SHADOW_MAX_CANDIDATES=${CARDRAG_RERANKER_SHADOW_MAX_CANDIDATES:-64}
      - CARDRAG_RERANKER_SHADOW_TIMEOUT_SECONDS=${CARDRAG_RERANKER_SHADOW_TIMEOUT_SECONDS:-60}
      - CARDRAG_RERANKER_SHADOW_MAX_RESPONSE_BYTES=${CARDRAG_RERANKER_SHADOW_MAX_RESPONSE_BYTES:-1048576}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_ENABLED=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_ENABLED:-false}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MODEL
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_PROVIDER_ID
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_EVALUATION_SHA256
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_INPUT_CHARACTERS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_INPUT_CHARACTERS:-262144}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_COMPLETION_TOKENS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_COMPLETION_TOKENS:-4096}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_JOB_PROVIDER_CALLS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_JOB_PROVIDER_CALLS:-4096}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_JOB_INPUT_CHARACTERS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_JOB_INPUT_CHARACTERS:-268435456}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_JOB_OUTPUT_TOKENS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_JOB_OUTPUT_TOKENS:-16777216}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_CONCURRENT_PROVIDER_CALLS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_CONCURRENT_PROVIDER_CALLS:-1}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_TIMEOUT_SECONDS=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_TIMEOUT_SECONDS:-120}
      - CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_RESPONSE_BYTES=${CARDRAG_EXPERIMENTAL_MAP_REDUCE_MAX_RESPONSE_BYTES:-1048576}
      - CARDRAG_WEBDAV_BASE_URL=${CARDRAG_WEBDAV_BASE_URL:?CARDRAG_WEBDAV_BASE_URL is required}
      - CARDRAG_WEBDAV_USERNAME
      - CARDRAG_WEBDAV_USERNAME_FILE
      - CARDRAG_WEBDAV_PASSWORD
      - CARDRAG_WEBDAV_PASSWORD_FILE
      - CARDRAG_WEBDAV_CA_FILE
      - CARDRAG_WEBDAV_CONNECT_TIMEOUT_SECONDS=${CARDRAG_WEBDAV_CONNECT_TIMEOUT_SECONDS:-10}
      - CARDRAG_WEBDAV_TRANSFER_TIMEOUT_SECONDS=${CARDRAG_WEBDAV_TRANSFER_TIMEOUT_SECONDS:-600}
      - CARDRAG_OPENROUTER_BASE_URL=${CARDRAG_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - CARDRAG_OPENROUTER_API_KEY
      - CARDRAG_OPENROUTER_API_KEY_FILE
    volumes:
      - mcp-state:/var/lib/cardrag-mcp
    ports:
      - "${CARDRAG_MCP_BIND_ADDRESS:-127.0.0.1}:${CARDRAG_MCP_PUBLISHED_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mcp-state:
    name: ${CARDRAG_MCP_STATE_VOLUME:-cardrag-mcp-v111-state}
