services:
  mcp:
    environment:
      CARDRAG_MCP_BEARER_TOKEN_FILE: /run/secrets/mcp_bearer_token
      CARDRAG_OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - mcp_bearer_token
      - openrouter_api_key

secrets:
  mcp_bearer_token:
    file: ${CARDRAG_MCP_BEARER_TOKEN_SECRET_FILE:?set CARDRAG_MCP_BEARER_TOKEN_SECRET_FILE}
  openrouter_api_key:
    file: ${CARDRAG_OPENROUTER_API_KEY_SECRET_FILE:?set CARDRAG_OPENROUTER_API_KEY_SECRET_FILE}
