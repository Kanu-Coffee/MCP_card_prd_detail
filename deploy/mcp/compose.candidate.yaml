name: cardrag-v113-candidate

services:
  mcp:
    image: ghcr.io/kanu-coffee/mcp-card-prd-detail-candidate@${CARDRAG_CANDIDATE_MCP_IMAGE_DIGEST:?receipt-bound MCP sha256 index digest is required}
    build: !reset null
    pull_policy: always
    environment:
      CARDRAG_CHANNEL: candidate-v1.0.11
      # Candidate reads the shared canonical root through its isolated channel.
      CARDRAG_WEBDAV_BASE_URL: ${CARDRAG_WEBDAV_BASE_URL:?shared CARDRAG_WEBDAV_BASE_URL is required}
      CARDRAG_MCP_PUBLIC_BASE_URL: ${CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL:?CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL is required}
      CARDRAG_RERANKER_SHADOW_ENABLED: ${CARDRAG_RERANKER_SHADOW_ENABLED:-false}
      CARDRAG_EXPERIMENTAL_MAP_REDUCE_ENABLED: "false"
      CARDRAG_MCP_MAX_VECTOR_BYTES: "1073741824"
      CARDRAG_MCP_MAX_RESIDENT_VECTOR_BYTES: "1073741824"
      CARDRAG_MCP_MAX_VECTOR_SIDECAR_BYTES: "17179869184"
      CARDRAG_MCP_MAX_SERVING_DATABASE_BYTES: "34359738368"
      CARDRAG_MCP_MAX_GENERATION_DOWNLOAD_BYTES: "68719476736"
      CARDRAG_MCP_MAX_STATE_BYTES: "137438953472"
      CARDRAG_MCP_RESERVED_FREE_SPACE_BYTES: "2147483648"
      CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_JOBS: "32"
      CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_TOTAL_BYTES: "2147483648"
      CARDRAG_MCP_EXHAUSTIVE_AUDIT_MAX_ARTIFACT_BYTES: "268435456"
      CARDRAG_MCP_RERANKER_AUDIT_MAX_JOBS: "1024"
      CARDRAG_MCP_RERANKER_AUDIT_MAX_TOTAL_BYTES: "536870912"
      CARDRAG_MCP_RERANKER_AUDIT_MAX_ARTIFACT_BYTES: "8388608"
    ports: !override
      - "${CARDRAG_CANDIDATE_MCP_BIND_ADDRESS:-127.0.0.1}:${CARDRAG_CANDIDATE_MCP_PUBLISHED_PORT:-18013}:8000"

volumes:
  mcp-state:
    name: cardrag-mcp-v113-candidate-state
