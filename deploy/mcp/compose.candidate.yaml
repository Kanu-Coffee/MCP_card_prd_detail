name: cardrag-v110-candidate

services:
  mcp:
    environment:
      CARDRAG_CHANNEL: candidate-v1.0.10
      CARDRAG_WEBDAV_BASE_URL: ${CARDRAG_CANDIDATE_WEBDAV_BASE_URL:?CARDRAG_CANDIDATE_WEBDAV_BASE_URL is required}
      CARDRAG_MCP_PUBLIC_BASE_URL: ${CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL:?CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL is required}
      CARDRAG_RERANKER_SHADOW_ENABLED: ${CARDRAG_RERANKER_SHADOW_ENABLED:-false}
      CARDRAG_MCP_MAX_SERVING_DATABASE_BYTES: ${CARDRAG_MCP_MAX_SERVING_DATABASE_BYTES:-4294967296}
      CARDRAG_MCP_MAX_GENERATION_DOWNLOAD_BYTES: ${CARDRAG_MCP_MAX_GENERATION_DOWNLOAD_BYTES:-34359738368}
      CARDRAG_MCP_MAX_STATE_BYTES: ${CARDRAG_MCP_MAX_STATE_BYTES:-68719476736}
      CARDRAG_MCP_RESERVED_FREE_SPACE_BYTES: ${CARDRAG_MCP_RESERVED_FREE_SPACE_BYTES:-2147483648}
    ports: !override
      - "${CARDRAG_CANDIDATE_MCP_BIND_ADDRESS:-127.0.0.1}:${CARDRAG_CANDIDATE_MCP_PUBLISHED_PORT:-18010}:8000"

volumes:
  mcp-state:
    name: cardrag-mcp-v110-state
