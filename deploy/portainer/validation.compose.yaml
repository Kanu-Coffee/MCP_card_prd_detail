name: cardrag-validation

# Post-restore read-path validation: intentionally omit the writer until auth,
# search, citation, PDF Range, and rollback checks have passed.
services:
  admin:
    profiles: !reset []
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${CARDRAG_VALIDATION_ROLLBACK_ENABLED:-false}" != true ]; then
          echo "validation rollback is disabled"
          exit 0
        fi
        if [ -n "$${CARDRAG_VALIDATION_ROLLBACK_GENERATION_ID:-}" ]; then
          set -- cardrag generation rollback \
            "$${CARDRAG_VALIDATION_ROLLBACK_GENERATION_ID}"
        else
          set -- cardrag generation rollback
        fi
        exec /usr/local/bin/cardrag-entrypoint "$$@"
      - --
    command: ["cardrag", "generation", "rollback"]
    environment:
      CARDRAG_VALIDATION_ROLLBACK_ENABLED: ${CARDRAG_VALIDATION_ROLLBACK_ENABLED:-false}
      CARDRAG_VALIDATION_ROLLBACK_GENERATION_ID: ${CARDRAG_VALIDATION_ROLLBACK_GENERATION_ID:-}
  worker: !reset null
  legacy-import: !reset null
