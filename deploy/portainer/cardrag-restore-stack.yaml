name: cardrag-restore
networks:
  backend:
    internal: true
    name: cardrag-restore_backend
secrets:
  cardrag_database_url:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_database_url.txt
    name: cardrag-restore_cardrag_database_url
  cardrag_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_db_password.txt
    name: cardrag-restore_cardrag_db_password
  cardrag_mcp_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_mcp_db_password.txt
    name: cardrag-restore_cardrag_mcp_db_password
  cardrag_worker_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_worker_db_password.txt
    name: cardrag-restore_cardrag_worker_db_password
  keycloak_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/keycloak_db_password.txt
    name: cardrag-restore_keycloak_db_password
  postgres_admin_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/postgres_admin_password.txt
    name: cardrag-restore_postgres_admin_password
services:
  postgres:
    cpus: ${CARDRAG_POSTGRES_CPUS:-2.0}
    environment:
      CARDRAG_DB_PASSWORD_FILE: /run/secrets/cardrag_db_password
      CARDRAG_MCP_DB_PASSWORD_FILE: /run/secrets/cardrag_mcp_db_password
      CARDRAG_WORKER_DB_PASSWORD_FILE: /run/secrets/cardrag_worker_db_password
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_USER: postgres
      TZ: Asia/Seoul
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 15s
      test:
        - CMD-SHELL
        - pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" && test
          "$$(psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --tuples-only
          --no-align --command "SELECT count(*) FROM pg_roles WHERE rolname IN ('cardrag','cardrag_worker','cardrag_mcp','keycloak')")"
          = 4 && test "$$(psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
          --tuples-only --no-align --command "SELECT count(*) FROM pg_database WHERE
          datname IN ('cardrag','keycloak')")" = 2
      timeout: 5s
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    mem_limit: ${CARDRAG_POSTGRES_MEMORY:-4g}
    networks:
      backend: null
    pids_limit: 256
    platform: linux/amd64
    restart: 'no'
    secrets:
      - source: postgres_admin_password
        target: /run/secrets/postgres_admin_password
      - source: cardrag_db_password
        target: /run/secrets/cardrag_db_password
      - source: cardrag_worker_db_password
        target: /run/secrets/cardrag_worker_db_password
      - source: cardrag_mcp_db_password
        target: /run/secrets/cardrag_mcp_db_password
      - source: keycloak_db_password
        target: /run/secrets/keycloak_db_password
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    stop_grace_period: 60s
    volumes:
      - source: postgres_data
        target: /var/lib/postgresql/data
        type: volume
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/postgres/init-databases.sh
        target: /docker-entrypoint-initdb.d/10-cardrag-databases.sh
        type: bind
  state-restore:
    cap_drop:
      - ALL
    command:
      - cardrag
      - state
      - restore
      - --source
      - ${CARDRAG_STATE_PACKAGE_PATH:-/mnt/cardrag-archive/READY-NOT-SET}
      - --empty-target
      - --verify-restored
    cpus: ${CARDRAG_ADMIN_CPUS:-2.0}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${CARDRAG_STATE_RESTORE_ENABLED:-false}" != true ]; then
          echo "state restore job is disabled; set CARDRAG_STATE_RESTORE_ENABLED=true for one deployment"
          exit 0
        fi
        exec /opt/cardrag-portainer/archive-preflight.sh \
          /mnt/cardrag-archive -- \
          /opt/cardrag-portainer/restore-preflight.sh \
          /mnt/cardrag-runtime /mnt/cardrag-archive -- \
          /usr/local/bin/cardrag-entrypoint "$$@"
      - --
    environment:
      CARDRAG_ARCHIVE_EXPECTED_SOURCE: ${CARDRAG_ARCHIVE_EXPECTED_SOURCE:-}
      CARDRAG_BUILD_ROOT: /mnt/cardrag-runtime/build
      CARDRAG_DATABASE_URL_FILE: /run/secrets/cardrag_database_url
      CARDRAG_DB_PASSWORD_FILE: /run/secrets/cardrag_db_password
      CARDRAG_DEPLOYMENT_METADATA_ROOT: /mnt/cardrag-deployment
      CARDRAG_ENVIRONMENT: production
      CARDRAG_GENERATION_ROOT: /mnt/cardrag-runtime/generations
      CARDRAG_MAXIMUM_USED_PERCENT: ${CARDRAG_MAXIMUM_USED_PERCENT:-85}
      CARDRAG_MCP_DB_PASSWORD_FILE: /run/secrets/cardrag_mcp_db_password
      CARDRAG_MINIMUM_FREE_GIB: ${CARDRAG_MINIMUM_FREE_GIB:-50}
      CARDRAG_MINIMUM_FREE_PERCENT: ${CARDRAG_MINIMUM_FREE_PERCENT:-20}
      CARDRAG_PAGE_CACHE_ROOT: /mnt/cardrag-runtime/page-cache
      CARDRAG_POSTGRES_ADMIN_HOST: postgres
      CARDRAG_POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      CARDRAG_POSTGRES_ADMIN_PORT: "5432"
      CARDRAG_POSTGRES_ADMIN_USER: postgres
      CARDRAG_STATE_PACKAGE_PATH: ${CARDRAG_STATE_PACKAGE_PATH:-/mnt/cardrag-archive/READY-NOT-SET}
      CARDRAG_STATE_RESTORE_ENABLED: ${CARDRAG_STATE_RESTORE_ENABLED:-false}
      CARDRAG_STORAGE_ROOT: /mnt/cardrag-runtime/objects
      CARDRAG_WARNING_USED_PERCENT: ${CARDRAG_WARNING_USED_PERCENT:-70}
      CARDRAG_WORKER_DB_PASSWORD_FILE: /run/secrets/cardrag_worker_db_password
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      TZ: Asia/Seoul
    image: ${CARDRAG_ADMIN_IMAGE:?CARDRAG_ADMIN_IMAGE_required}
    init: true
    mem_limit: ${CARDRAG_ADMIN_MEMORY:-4g}
    networks:
      backend: null
    pids_limit: 256
    platform: linux/amd64
    pull_policy: always
    read_only: true
    restart: 'no'
    secrets:
      - source: cardrag_database_url
        target: cardrag_database_url
      - source: postgres_admin_password
        target: postgres_admin_password
      - source: cardrag_db_password
        target: cardrag_db_password
      - source: cardrag_worker_db_password
        target: cardrag_worker_db_password
      - source: cardrag_mcp_db_password
        target: cardrag_mcp_db_password
      - source: keycloak_db_password
        target: keycloak_db_password
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
      - /var/lib/cardrag-home:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
    user: 10001:10001
    volumes:
      - bind:
          create_host_path: false
          propagation: rprivate
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}
        target: /mnt/cardrag-runtime
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_ARCHIVE_ROOT:-/mnt/cardrag-backup/cardrag}
        target: /mnt/cardrag-archive
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_DEPLOYMENT_ROOT:-/srv/cardrag/config/deployment}
        target: /mnt/cardrag-deployment
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/storage-preflight.sh
        target: /opt/cardrag-portainer/storage-preflight.sh
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/archive-preflight.sh
        target: /opt/cardrag-portainer/archive-preflight.sh
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/restore-preflight.sh
        target: /opt/cardrag-portainer/restore-preflight.sh
        type: bind
volumes:
  postgres_data:
    external: true
    name: ${CARDRAG_POSTGRES_VOLUME:-cardrag-postgres-v1}
