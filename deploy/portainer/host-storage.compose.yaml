# Portainer production storage overlay. Apply after compose.yaml and before/with
# deploy/dockerhub.compose.yaml. Bind sources are intentionally not auto-created.
services:
  postgres:
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/postgres/init-databases.sh
        target: /docker-entrypoint-initdb.d/10-cardrag-databases.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate

  postgres-extension-upgrade:
    volumes:
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/postgres/upgrade-vector.sh
        target: /opt/cardrag-postgres/upgrade-vector.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate

  keycloak:
    volumes:
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/keycloak/cardrag-realm.json
        target: /opt/keycloak/data/import/cardrag-realm.json
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/keycloak/entrypoint.sh
        target: /opt/cardrag/keycloak-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate

  volume-init:
    volumes:
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/objects
        target: /var/lib/cardrag/objects
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/generations
        target: /var/lib/cardrag/generations
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/build
        target: /var/lib/cardrag-build
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/page-cache
        target: /var/cache/cardrag-pages
        bind:
          create_host_path: false
          propagation: rprivate
      - type: volume
        source: codex_auth
        target: /run/cardrag-codex

  admin:
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${CARDRAG_ADMIN_OPERATION_ENABLED:-false}" != true ]; then
          echo "admin one-shot is disabled; select an allow-listed operation and enable it once"
          exit 0
        fi
        operation=$${CARDRAG_ADMIN_OPERATION:-}
        operation_id=$${CARDRAG_ADMIN_OPERATION_ID:-}
        case "$$operation" in
          legacy-status|legacy-finalize|run-status|run-finalize|generation-verify)
            if [ -z "$$operation_id" ]; then
              echo "CARDRAG_ADMIN_OPERATION_ID is required for $$operation" >&2
              exit 64
            fi
            ;;
        esac
        case "$$operation" in
          legacy-status) set -- cardrag legacy status "$$operation_id" ;;
          legacy-finalize) set -- cardrag legacy finalize "$$operation_id" ;;
          run-list) set -- cardrag run list --state running --limit 100 ;;
          run-bulk) set -- cardrag run bulk ;;
          run-daily) set -- cardrag run daily ;;
          run-status) set -- cardrag run status "$$operation_id" ;;
          run-finalize) set -- cardrag run finalize "$$operation_id" ;;
          job-status) set -- cardrag job status ;;
          generation-verify) set -- cardrag generation verify "$$operation_id" ;;
          retention-prune) set -- cardrag retention prune ;;
          *)
            echo "unsupported CARDRAG_ADMIN_OPERATION" >&2
            exit 64
            ;;
        esac
        exec /usr/local/bin/cardrag-entrypoint "$$@"
      - --
    environment:
      CARDRAG_ADMIN_OPERATION_ENABLED: ${CARDRAG_ADMIN_OPERATION_ENABLED:-false}
      CARDRAG_ADMIN_OPERATION: ${CARDRAG_ADMIN_OPERATION:-}
      CARDRAG_ADMIN_OPERATION_ID: ${CARDRAG_ADMIN_OPERATION_ID:-}
    volumes:
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/objects
        target: /var/lib/cardrag/objects
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/generations
        target: /var/lib/cardrag/generations
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/build
        target: /var/lib/cardrag-build
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/page-cache
        target: /var/cache/cardrag-pages
        bind:
          create_host_path: false
          propagation: rprivate

  legacy-import:
    volumes:
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/objects
        target: /var/lib/cardrag/objects
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/generations
        target: /var/lib/cardrag/generations
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/build
        target: /var/lib/cardrag-build
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/storage-preflight.sh
        target: /opt/cardrag-portainer/storage-preflight.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
  # Portable state jobs are deliberately absent from the normal Portainer
  # Stack. Use the dedicated export and restore Stacks after removing normal
  # application containers from the external PostgreSQL volume.
  state-export: !reset null
  state-restore: !reset null

  worker:
    profiles: !reset []
    volumes:
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/objects
        target: /var/lib/cardrag/objects
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/generations
        target: /var/lib/cardrag/generations
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/build
        target: /var/lib/cardrag-build
        bind:
          create_host_path: false
          propagation: rprivate
      - type: volume
        source: codex_auth
        target: /run/cardrag-codex

  mcp:
    volumes:
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/objects
        target: /var/lib/cardrag/objects
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/generations
        target: /var/lib/cardrag/generations
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_DATA_ROOT:-/srv/cardrag/runtime}/page-cache
        target: /var/cache/cardrag-pages
        bind:
          create_host_path: false
          propagation: rprivate

volumes:
  postgres_data:
    name: ${CARDRAG_POSTGRES_VOLUME:-cardrag-postgres-v1}
    external: true
  codex_auth:
    name: ${CARDRAG_CODEX_AUTH_VOLUME:-cardrag-codex-auth-v1}
    external: true
  cardrag_objects: !reset null
  cardrag_generations: !reset null
  cardrag_build: !reset null
  page_cache: !reset null

secrets:
  postgres_admin_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/postgres_admin_password.txt
  cardrag_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_db_password.txt
  cardrag_worker_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_worker_db_password.txt
  cardrag_mcp_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_mcp_db_password.txt
  cardrag_database_url:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_database_url.txt
  cardrag_worker_database_url:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_worker_database_url.txt
  cardrag_mcp_database_url:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_mcp_database_url.txt
  keycloak_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/keycloak_db_password.txt
  openrouter_api_key:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/openrouter_api_key.txt
