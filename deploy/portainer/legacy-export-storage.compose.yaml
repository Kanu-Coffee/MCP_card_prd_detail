name: cardrag-export-legacy

# One-time v0.1.2 (schema 13) bridge. This overlay is used only after the old
# Stack has been removed and the external PostgreSQL volume is exclusively
# attached here. It seals raw PG17 dumps of both databases before applying only
# migration 014, then lets the ordinary schema-14 portable exporter run.
services:
  schema13-safety-backup:
    image: ${CARDRAG_ADMIN_IMAGE:?CARDRAG_ADMIN_IMAGE_required}
    platform: linux/amd64
    pull_policy: always
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 60s
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${CARDRAG_SCHEMA13_TRANSITION_ENABLED:-false}" != true ]; then
          echo "schema-13 safety backup is disabled"
          exit 0
        fi
        exec /opt/cardrag-portainer/archive-preflight.sh \
          /mnt/cardrag-archive -- \
          /opt/cardrag-portainer/storage-preflight.sh \
          /mnt/cardrag-archive -- \
          /opt/cardrag-portainer/schema13-transition.sh backup
    environment: &transition_environment
      CARDRAG_POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      CARDRAG_POSTGRES_ADMIN_HOST: postgres
      CARDRAG_POSTGRES_ADMIN_PORT: "5432"
      CARDRAG_POSTGRES_ADMIN_USER: postgres
      CARDRAG_ARCHIVE_ROOT: /mnt/cardrag-archive
      CARDRAG_ARCHIVE_EXPECTED_SOURCE: ${CARDRAG_ARCHIVE_EXPECTED_SOURCE:-}
      CARDRAG_TRANSITION_MIGRATION_ROOT: /opt/cardrag-transition/migrations
      CARDRAG_SCHEMA13_TRANSITION_ENABLED: ${CARDRAG_SCHEMA13_TRANSITION_ENABLED:-false}
      CARDRAG_SCHEMA13_TRANSITION_ID: ${CARDRAG_SCHEMA13_TRANSITION_ID:-READY-NOT-SET}
      CARDRAG_SCHEMA13_TRANSITION_RESUME: ${CARDRAG_SCHEMA13_TRANSITION_RESUME:-false}
      CARDRAG_MINIMUM_FREE_GIB: ${CARDRAG_MINIMUM_FREE_GIB:-50}
      CARDRAG_MINIMUM_FREE_PERCENT: ${CARDRAG_MINIMUM_FREE_PERCENT:-20}
      CARDRAG_MAXIMUM_USED_PERCENT: ${CARDRAG_MAXIMUM_USED_PERCENT:-85}
      CARDRAG_WARNING_USED_PERCENT: ${CARDRAG_WARNING_USED_PERCENT:-70}
      TZ: Asia/Seoul
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
    volumes: &transition_volumes
      - type: bind
        source: ${CARDRAG_ARCHIVE_ROOT:-/mnt/cardrag-backup/cardrag}
        target: /mnt/cardrag-archive
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/migrations
        target: /opt/cardrag-transition/migrations
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/schema13-transition.sh
        target: /opt/cardrag-portainer/schema13-transition.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/storage-preflight.sh
        target: /opt/cardrag-portainer/storage-preflight.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/archive-preflight.sh
        target: /opt/cardrag-portainer/archive-preflight.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  schema14-upgrade:
    image: ${CARDRAG_ADMIN_IMAGE:?CARDRAG_ADMIN_IMAGE_required}
    platform: linux/amd64
    pull_policy: always
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 60s
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ "$${CARDRAG_SCHEMA13_TRANSITION_ENABLED:-false}" != true ]; then
          echo "schema-14 controlled upgrade is disabled"
          exit 0
        fi
        exec /opt/cardrag-portainer/archive-preflight.sh \
          /mnt/cardrag-archive -- \
          /opt/cardrag-portainer/schema13-transition.sh upgrade
    environment: *transition_environment
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
    volumes:
      - type: bind
        source: ${CARDRAG_ARCHIVE_ROOT:-/mnt/cardrag-backup/cardrag}
        target: /mnt/cardrag-archive
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/migrations
        target: /opt/cardrag-transition/migrations
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/schema13-transition.sh
        target: /opt/cardrag-portainer/schema13-transition.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/portainer/archive-preflight.sh
        target: /opt/cardrag-portainer/archive-preflight.sh
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
    depends_on:
      postgres:
        condition: service_healthy
      schema13-safety-backup:
        condition: service_completed_successfully
    networks:
      - backend

  state-export:
    environment:
      # A schema-13 source may export only after this overlay's sealed raw
      # backup and controlled 014 upgrade both succeed.
      CARDRAG_STATE_EXPORT_ENABLED: ${CARDRAG_SCHEMA13_TRANSITION_ENABLED:-false}
    volumes:
      - type: volume
        source: legacy_objects
        target: /var/lib/cardrag/objects
        read_only: true
      - type: volume
        source: legacy_generations
        target: /var/lib/cardrag/generations
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      schema14-upgrade:
        condition: service_completed_successfully

volumes:
  legacy_objects:
    name: ${CARDRAG_LEGACY_OBJECTS_VOLUME:?run_discover-legacy-volumes.sh}
    external: true
  legacy_generations:
    name: ${CARDRAG_LEGACY_GENERATIONS_VOLUME:?run_discover-legacy-volumes.sh}
    external: true
