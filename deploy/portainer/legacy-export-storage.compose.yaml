name: cardrag-export-schema13

# v0.1.2/schema-13 only: select the discovered external named-volume corpus.
# The common schema transition overlay provides the database jobs.
services:
  state-export:
    volumes:
      - type: volume
        source: legacy_objects
        target: /var/lib/cardrag/objects
        read_only: true
      - type: volume
        source: legacy_generations
        target: /var/lib/cardrag/generations
        read_only: true

volumes:
  legacy_objects:
    name: ${CARDRAG_LEGACY_OBJECTS_VOLUME:?run_discover-legacy-volumes.sh}
    external: true
  legacy_generations:
    name: ${CARDRAG_LEGACY_GENERATIONS_VOLUME:?run_discover-legacy-volumes.sh}
    external: true
