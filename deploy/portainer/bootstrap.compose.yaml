name: cardrag-bootstrap

# Fresh-host Keycloak bootstrap only.  This Stack must be removed after a
# permanent administrator has been verified; the normal Stack never mounts the
# bootstrap credential.
services:
  keycloak:
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-cardrag-bootstrap}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
    secrets:
      - source: keycloak_db_password
        target: /run/secrets/keycloak_db_password
      - source: keycloak_admin_password
        target: /run/secrets/keycloak_admin_password

  volume-init: !reset null
  admin: !reset null
  legacy-import: !reset null
  state-export: !reset null
  state-restore: !reset null
  migrate: !reset null
  worker: !reset null
  mcp: !reset null

volumes:
  codex_auth: !reset null

secrets:
  cardrag_database_url: !reset null
  cardrag_worker_database_url: !reset null
  cardrag_mcp_database_url: !reset null
  openrouter_api_key: !reset null
  keycloak_admin_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/keycloak_admin_password.txt
