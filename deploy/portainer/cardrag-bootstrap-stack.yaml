name: cardrag-bootstrap
networks:
  backend:
    internal: false
    name: cardrag-bootstrap_backend
secrets:
  cardrag_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_db_password.txt
    name: cardrag-bootstrap_cardrag_db_password
  cardrag_mcp_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_mcp_db_password.txt
    name: cardrag-bootstrap_cardrag_mcp_db_password
  cardrag_worker_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/cardrag_worker_db_password.txt
    name: cardrag-bootstrap_cardrag_worker_db_password
  keycloak_admin_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/keycloak_admin_password.txt
    name: cardrag-bootstrap_keycloak_admin_password
  keycloak_db_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/keycloak_db_password.txt
    name: cardrag-bootstrap_keycloak_db_password
  postgres_admin_password:
    file: ${CARDRAG_SECRETS_DIR:-/srv/cardrag/secrets}/postgres_admin_password.txt
    name: cardrag-bootstrap_postgres_admin_password
services:
  keycloak:
    cap_drop:
      - ALL
    command:
      - start
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --import-realm
    cpus: ${CARDRAG_KEYCLOAK_CPUS:-1.5}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    entrypoint:
      - /opt/cardrag/keycloak-entrypoint.sh
    environment:
      - KC_DB=postgres
      - KC_DB_PASSWORD_FILE=/run/secrets/keycloak_db_password
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://cardrag-keycloak.localhost:8080}
      - KC_HTTP_MANAGEMENT_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_PORT=9000
      - KC_HTTP_MANAGEMENT_SCHEME=http
      - KC_METRICS_ENABLED=true
      - TZ=Asia/Seoul
      - KC_BOOTSTRAP_ADMIN_PASSWORD_FILE=/run/secrets/keycloak_admin_password
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-cardrag-bootstrap}
    healthcheck:
      interval: 10s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf ''GET /health/ready HTTP/1.1\r\nHost:
          localhost\r\nConnection: close\r\n\r\n'' >&3; grep -q ''200 OK'' <&3'
      timeout: 5s
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    init: true
    mem_limit: ${CARDRAG_KEYCLOAK_MEMORY:-1536m}
    networks:
      backend:
        aliases:
          - cardrag-keycloak.localhost
    pids_limit: 256
    platform: linux/amd64
    ports:
      - host_ip: 127.0.0.1
        mode: ingress
        protocol: tcp
        published: "8080"
        target: 8080
    restart: unless-stopped
    secrets:
      - source: keycloak_db_password
        target: /run/secrets/keycloak_db_password
      - source: keycloak_admin_password
        target: /run/secrets/keycloak_admin_password
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    volumes:
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/keycloak/cardrag-realm.json
        target: /opt/keycloak/data/import/cardrag-realm.json
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/keycloak/entrypoint.sh
        target: /opt/cardrag/keycloak-entrypoint.sh
        type: bind
  postgres:
    cpus: ${CARDRAG_POSTGRES_CPUS:-2.0}
    environment:
      CARDRAG_DB_PASSWORD_FILE: /run/secrets/cardrag_db_password
      CARDRAG_MCP_DB_PASSWORD_FILE: /run/secrets/cardrag_mcp_db_password
      CARDRAG_WORKER_DB_PASSWORD_FILE: /run/secrets/cardrag_worker_db_password
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_USER: postgres
      TZ: Asia/Seoul
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 15s
      test:
        - CMD-SHELL
        - pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" && test
          "$$(psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --tuples-only
          --no-align --command "SELECT count(*) FROM pg_roles WHERE rolname IN ('cardrag','cardrag_worker','cardrag_mcp','keycloak')")"
          = 4 && test "$$(psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
          --tuples-only --no-align --command "SELECT count(*) FROM pg_database WHERE
          datname IN ('cardrag','keycloak')")" = 2 && test "$$(psql --username "$$POSTGRES_USER"
          --dbname cardrag --tuples-only --no-align --command "SELECT count(*) FROM
          pg_extension WHERE extname='vector'")" = 1
      timeout: 5s
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    mem_limit: ${CARDRAG_POSTGRES_MEMORY:-4g}
    networks:
      backend: null
    pids_limit: 256
    platform: linux/amd64
    restart: unless-stopped
    secrets:
      - source: postgres_admin_password
        target: /run/secrets/postgres_admin_password
      - source: cardrag_db_password
        target: /run/secrets/cardrag_db_password
      - source: cardrag_worker_db_password
        target: /run/secrets/cardrag_worker_db_password
      - source: cardrag_mcp_db_password
        target: /run/secrets/cardrag_mcp_db_password
      - source: keycloak_db_password
        target: /run/secrets/keycloak_db_password
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    stop_grace_period: 60s
    volumes:
      - source: postgres_data
        target: /var/lib/postgresql/data
        type: volume
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: true
        source: ${CARDRAG_CONFIG_ROOT:-/srv/cardrag/config}/postgres/init-databases.sh
        target: /docker-entrypoint-initdb.d/10-cardrag-databases.sh
        type: bind
volumes:
  postgres_data:
    external: true
    name: ${CARDRAG_POSTGRES_VOLUME:-cardrag-postgres-v1}
x-app-common:
  cap_drop:
    - ALL
  environment:
    CARDRAG_BUILD_ROOT: /var/lib/cardrag-build
    CARDRAG_DATABASE_URL_FILE: /run/secrets/cardrag_database_url
    CARDRAG_ENVIRONMENT: production
    CARDRAG_GENERATION_ROOT: /var/lib/cardrag/generations
    CARDRAG_MCP_SERVER_URL: http://localhost:8000/mcp
    CARDRAG_OIDC_AUDIENCE: cardrag-mcp
    CARDRAG_OIDC_ISSUER: ${CARDRAG_OIDC_ISSUER:-http://cardrag-keycloak.localhost:8080/realms/cardrag}
    CARDRAG_OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    CARDRAG_PAGE_CACHE_ROOT: /var/cache/cardrag-pages
    CARDRAG_STORAGE_ROOT: /var/lib/cardrag/objects
    TZ: Asia/Seoul
  init: true
  networks:
    - backend
  pids_limit: 256
  platform: linux/amd64
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 60s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
    - /var/lib/cardrag-home:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
  user: 10001:10001
