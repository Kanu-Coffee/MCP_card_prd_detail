name: cardrag-v110-candidate

services:
  worker:
    environment:
      CARDRAG_CHANNEL: candidate-v1.0.10
      CARDRAG_STABLE_PUBLICATION_APPROVED: "false"
      CARDRAG_OCR_CACHE_PUBLICATION_APPROVED: "false"
      CARDRAG_REMOTE_GC_APPROVED: "false"
      CARDRAG_WEBDAV_BASE_URL: ${CARDRAG_CANDIDATE_WEBDAV_BASE_URL:?CARDRAG_CANDIDATE_WEBDAV_BASE_URL is required}
      CARDRAG_COLLECT_REMOTE_GARBAGE: "false"
      CARDRAG_WORKER_MAX_STATE_BYTES: ${CARDRAG_WORKER_MAX_STATE_BYTES:-68719476736}
      CARDRAG_WORKER_RESERVED_FREE_SPACE_BYTES: ${CARDRAG_WORKER_RESERVED_FREE_SPACE_BYTES:-2147483648}
      CARDRAG_WORKER_MAX_VECTOR_SIDECAR_BYTES: ${CARDRAG_WORKER_MAX_VECTOR_SIDECAR_BYTES:-17179869184}
      CARDRAG_WORKER_MAX_SERVING_DATABASE_BYTES: ${CARDRAG_WORKER_MAX_SERVING_DATABASE_BYTES:-4294967296}
      # Release candidate launch is intentionally non-overridable: same-host
      # Worker/MCP duplication requires an audited 32 GiB startup floor.
      CARDRAG_WORKER_MINIMUM_START_FREE_BYTES: "34359738368"
      CARDRAG_OCR_CACHE_MODE: "read-only"
      CARDRAG_EMBEDDING_MODEL: qwen/qwen3-embedding-8b
      CARDRAG_EMBEDDING_DIMENSION: "4096"
      CARDRAG_EMBEDDING_PROVIDER_ID: ${CARDRAG_EMBEDDING_PROVIDER_ID:-deepinfra}
      CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES: ${CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES:-33554432}
      CARDRAG_EMBEDDING_METADATA_MAX_RESPONSE_BYTES: ${CARDRAG_EMBEDDING_METADATA_MAX_RESPONSE_BYTES:-2097152}

volumes:
  worker-state:
    name: cardrag-worker-v110-state
