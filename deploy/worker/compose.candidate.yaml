name: cardrag-v113-candidate

services:
  worker:
    image: ghcr.io/kanu-coffee/mcp-card-prd-detail-candidate@${CARDRAG_CANDIDATE_WORKER_IMAGE_DIGEST:?receipt-bound Worker sha256 index digest is required}
    build: !reset null
    pull_policy: always
    environment:
      CARDRAG_CHANNEL: candidate-v1.0.11
      CARDRAG_STABLE_PUBLICATION_APPROVED: "false"
      CARDRAG_OCR_CACHE_PUBLICATION_APPROVED: "false"
      CARDRAG_REMOTE_GC_APPROVED: "false"
      # Candidate resumes and verified native-cache HEAD/GETs use the same
      # canonical WebDAV root as stable. Isolation is by channel, not base URL.
      CARDRAG_WEBDAV_BASE_URL: ${CARDRAG_WEBDAV_BASE_URL:?shared CARDRAG_WEBDAV_BASE_URL is required}
      CARDRAG_COLLECT_REMOTE_GARBAGE: "false"
      CARDRAG_WORKER_MAX_STATE_BYTES: "137438953472"
      CARDRAG_WORKER_RESERVED_FREE_SPACE_BYTES: "2147483648"
      CARDRAG_WORKER_MAX_VECTOR_SIDECAR_BYTES: "17179869184"
      CARDRAG_WORKER_MAX_SERVING_DATABASE_BYTES: "34359738368"
      # Release candidate launch is intentionally non-overridable: same-host
      # Worker/MCP duplication requires an audited 32 GiB startup floor.
      CARDRAG_WORKER_MINIMUM_START_FREE_BYTES: "34359738368"
      CARDRAG_ENABLED_ISSUERS: kb,samsung,shinhan,woori
      CARDRAG_OCR_CACHE_MODE: "read-only"
      CARDRAG_EMBEDDING_MODEL: qwen/qwen3-embedding-8b
      CARDRAG_EMBEDDING_DIMENSION: "4096"
      CARDRAG_EMBEDDING_PROVIDER_ID: ${CARDRAG_EMBEDDING_PROVIDER_ID:-deepinfra}
      CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES: ${CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES:-33554432}
      CARDRAG_EMBEDDING_METADATA_MAX_RESPONSE_BYTES: ${CARDRAG_EMBEDDING_METADATA_MAX_RESPONSE_BYTES:-2097152}
      CARDRAG_EMBEDDING_REQUEST_MAX_ATTEMPTS: "12"
      CARDRAG_EMBEDDING_RETRY_BASE_SECONDS: "1"
      CARDRAG_EMBEDDING_RETRY_CAP_SECONDS: "60"

volumes:
  worker-state:
    name: cardrag-worker-v113-candidate-state
  codex-home:
    name: cardrag-worker-v113-candidate-codex-home
