services:
  worker:
    environment:
      CARDRAG_WEBDAV_USERNAME_FILE: /run/secrets/webdav_username
      CARDRAG_WEBDAV_PASSWORD_FILE: /run/secrets/webdav_password
      CARDRAG_OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - webdav_username
      - webdav_password
      - openrouter_api_key

secrets:
  webdav_username:
    file: ${CARDRAG_WEBDAV_USERNAME_SECRET_FILE:?set CARDRAG_WEBDAV_USERNAME_SECRET_FILE}
  webdav_password:
    file: ${CARDRAG_WEBDAV_PASSWORD_SECRET_FILE:?set CARDRAG_WEBDAV_PASSWORD_SECRET_FILE}
  openrouter_api_key:
    file: ${CARDRAG_OPENROUTER_API_KEY_SECRET_FILE:?set CARDRAG_OPENROUTER_API_KEY_SECRET_FILE}
