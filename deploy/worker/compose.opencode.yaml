services:
  worker:
    environment:
      - CARDRAG_OCR_PROVIDER=opencode
      - CARDRAG_OCR_MODEL=${CARDRAG_OPENCODE_OCR_MODEL:-alibaba-token-plan/qwen3.8-flash}
      - CARDRAG_OCR_REASONING_EFFORT=${CARDRAG_OPENCODE_OCR_REASONING_EFFORT:-medium}
      - CARDRAG_EXTERNAL_OCR_ALLOWED=true
      - CARDRAG_OPENCODE_AGENT=${CARDRAG_OPENCODE_AGENT:-ocr}
      - CARDRAG_OPENCODE_EXECUTABLE=${CARDRAG_OPENCODE_EXECUTABLE:-opencode}
      - CARDRAG_OPENCODE_API_KEY_ENV_KEY=${CARDRAG_OPENCODE_API_KEY_ENV_KEY:-ALIBABA_TOKEN_PLAN_API_KEY}
      - ALIBABA_TOKEN_PLAN_API_KEY
