services:
  worker:
    volumes:
      - type: volume
        source: seed-worker-state
        target: /mnt/cardrag-seed-state
        read_only: true
        volume:
          nocopy: true

volumes:
  seed-worker-state:
    external: true
    name: ${CARDRAG_SEED_WORKER_STATE_VOLUME:?explicit offline verified seed volume is required}
