name: cardrag-worker

services:
  worker:
    image: ${CARDRAG_WORKER_IMAGE:-cardrag-worker:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    restart: "no"
    init: true
    stop_signal: SIGTERM
    user: "10001:10001"
    environment:
      - CARDRAG_ENVIRONMENT=${CARDRAG_ENVIRONMENT:-production}
      - CARDRAG_CHANNEL=${CARDRAG_CHANNEL:-stable}
      - CARDRAG_STABLE_PUBLICATION_APPROVED=${CARDRAG_STABLE_PUBLICATION_APPROVED:-false}
      - CARDRAG_OCR_CACHE_PUBLICATION_APPROVED=${CARDRAG_OCR_CACHE_PUBLICATION_APPROVED:-false}
      - CARDRAG_REMOTE_GC_APPROVED=${CARDRAG_REMOTE_GC_APPROVED:-false}
      - CARDRAG_WORKER_STATE_DIR=/var/lib/cardrag-worker
      - CARDRAG_WORKER_MAX_STATE_BYTES=${CARDRAG_WORKER_MAX_STATE_BYTES:-137438953472}
      - CARDRAG_WORKER_RESERVED_FREE_SPACE_BYTES=${CARDRAG_WORKER_RESERVED_FREE_SPACE_BYTES:-2147483648}
      - CARDRAG_WORKER_MAX_VECTOR_SIDECAR_BYTES=${CARDRAG_WORKER_MAX_VECTOR_SIDECAR_BYTES:-17179869184}
      - CARDRAG_WORKER_MAX_SERVING_DATABASE_BYTES=${CARDRAG_WORKER_MAX_SERVING_DATABASE_BYTES:-34359738368}
      - CARDRAG_WORKER_MINIMUM_START_FREE_BYTES=${CARDRAG_WORKER_MINIMUM_START_FREE_BYTES:-2147483648}
      - CARDRAG_ENABLED_ISSUERS=${CARDRAG_ENABLED_ISSUERS:-woori,kb,shinhan,samsung}
      - CARDRAG_WEBDAV_BASE_URL=${CARDRAG_WEBDAV_BASE_URL:?CARDRAG_WEBDAV_BASE_URL is required}
      - CARDRAG_WEBDAV_USERNAME
      - CARDRAG_WEBDAV_USERNAME_FILE
      - CARDRAG_WEBDAV_PASSWORD
      - CARDRAG_WEBDAV_PASSWORD_FILE
      - CARDRAG_WEBDAV_CA_FILE
      - CARDRAG_WEBDAV_CONNECT_TIMEOUT_SECONDS=${CARDRAG_WEBDAV_CONNECT_TIMEOUT_SECONDS:-10}
      - CARDRAG_WEBDAV_TRANSFER_TIMEOUT_SECONDS=${CARDRAG_WEBDAV_TRANSFER_TIMEOUT_SECONDS:-600}
      - CARDRAG_OPENROUTER_BASE_URL=${CARDRAG_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - CARDRAG_OPENROUTER_API_KEY
      - CARDRAG_OPENROUTER_API_KEY_FILE
      - CARDRAG_EMBEDDING_MODEL=${CARDRAG_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      - CARDRAG_EMBEDDING_DIMENSION=4096
      - CARDRAG_EMBEDDING_PROVIDER_ID=${CARDRAG_EMBEDDING_PROVIDER_ID:-deepinfra}
      - CARDRAG_EMBEDDING_MAXIMUM_TOKENS=${CARDRAG_EMBEDDING_MAXIMUM_TOKENS:-32768}
      - CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES=${CARDRAG_EMBEDDING_MAX_RESPONSE_BYTES:-33554432}
      - CARDRAG_EMBEDDING_METADATA_MAX_RESPONSE_BYTES=${CARDRAG_EMBEDDING_METADATA_MAX_RESPONSE_BYTES:-2097152}
      - CARDRAG_OCR_PROVIDER=${CARDRAG_OCR_PROVIDER:-codex-exec}
      - CARDRAG_OCR_MODEL=${CARDRAG_OCR_MODEL:-gpt-5.6-sol}
      - CARDRAG_OCR_FALLBACK_PROVIDER
      - CARDRAG_OCR_FALLBACK_MODEL
      - CARDRAG_OCR_REASONING_EFFORT=${CARDRAG_OCR_REASONING_EFFORT:-high}
      - CARDRAG_OCR_PROVIDER_TIMEOUT_SECONDS=${CARDRAG_OCR_PROVIDER_TIMEOUT_SECONDS:-1800}
      - CARDRAG_OCR_CACHE_MODE=${CARDRAG_OCR_CACHE_MODE:-read-only}
      - CARDRAG_OCR_CACHE_EPOCH=${CARDRAG_OCR_CACHE_EPOCH:-0}
      - CARDRAG_OCR_PROMPT_VERSION=${CARDRAG_OCR_PROMPT_VERSION:-cardrag-ocr.ko.v2}
      - CARDRAG_OCR_RENDER_SCALE_MILLI=${CARDRAG_OCR_RENDER_SCALE_MILLI:-6000}
      - CARDRAG_OCR_WHOLE_DOCUMENT_MAX_PAGES=${CARDRAG_OCR_WHOLE_DOCUMENT_MAX_PAGES:-4}
      - CARDRAG_OCR_CHUNK_PAGES=${CARDRAG_OCR_CHUNK_PAGES:-2}
      - CARDRAG_OCR_CONTEXT_PAGES_BEFORE=${CARDRAG_OCR_CONTEXT_PAGES_BEFORE:-1}
      - CARDRAG_OCR_CONTEXT_PAGES_AFTER=${CARDRAG_OCR_CONTEXT_PAGES_AFTER:-1}
      - CARDRAG_STAGE_MAX_ATTEMPTS=${CARDRAG_STAGE_MAX_ATTEMPTS:-4}
      - CARDRAG_RETRY_CAP_SECONDS=${CARDRAG_RETRY_CAP_SECONDS:-30}
      - CARDRAG_PDF_CACHE_REFRESH_HOURS=${CARDRAG_PDF_CACHE_REFRESH_HOURS:-168}
      - CARDRAG_RETAIN_GENERATIONS=${CARDRAG_RETAIN_GENERATIONS:-2}
      - CARDRAG_RETAIN_INCOMPLETE_RUNS=${CARDRAG_RETAIN_INCOMPLETE_RUNS:-2}
      - CARDRAG_GARBAGE_GRACE_DAYS=${CARDRAG_GARBAGE_GRACE_DAYS:-30}
      - CARDRAG_COLLECT_REMOTE_GARBAGE=${CARDRAG_COLLECT_REMOTE_GARBAGE:-false}
      - CARDRAG_CODEX_EXECUTABLE=/usr/local/bin/codex
      - CARDRAG_CODEX_AUTH_ROOT=/var/lib/cardrag-codex-home
      - CODEX_HOME=/var/lib/cardrag-codex-home
      - HOME=/var/lib/cardrag-codex-home/home
    volumes:
      - worker-state:/var/lib/cardrag-worker
      - codex-home:/var/lib/cardrag-codex-home
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Codex's read-only Linux sandbox creates a nested bubblewrap user/mount
      # namespace. Docker's default seccomp and AppArmor profiles deny those
      # setup syscalls before the inner sandbox can install its own seccomp
      # filter. Keep this Worker-only; UID 10001, the read-only rootfs, all-cap
      # drop, NNP, and Docker's protected system paths remain enforced.
      - seccomp=unconfined
      - apparmor=unconfined
    command: ["run"]

volumes:
  worker-state:
    name: ${CARDRAG_WORKER_STATE_VOLUME:-cardrag-worker-v111-state}
  codex-home:
    name: ${CARDRAG_WORKER_CODEX_HOME_VOLUME:-cardrag-worker-v111-codex-home}
