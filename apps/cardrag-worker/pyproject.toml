[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardrag-worker"
version = "1.0.0"
description = "Offline acquisition, OCR, embedding, and serving-bundle worker for CardRAG"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "cardrag-core",
  "cryptography>=50,<51",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "lxml>=5.4,<7",
  "Pillow>=12,<13",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pypdfium2==5.12.1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pypdf>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
]

[project.scripts]
cardrag-worker = "cardrag_worker.cli:app"

[tool.uv.sources]
cardrag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cardrag_worker"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = ["E501", "S101", "B008", "ASYNC240"]
