name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install workspace
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv lock --check
          uv sync --frozen --all-packages --all-extras

      - name: Install checksum-pinned release audit tools
        shell: bash
        run: |
          set -euo pipefail
          audit_tools_dir="$RUNNER_TEMP/cardrag-release-audit-tools"
          mkdir -p \
            "$audit_tools_dir/actionlint-unpack" \
            "$audit_tools_dir/gitleaks-unpack" \
            "$audit_tools_dir/trivy-unpack" \
            "$audit_tools_dir/shellcheck-unpack"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location --retry 3 \
            --output "$audit_tools_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location --retry 3 \
            --output "$audit_tools_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location --retry 3 \
            --output "$audit_tools_dir/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location --retry 3 \
            --output "$audit_tools_dir/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $audit_tools_dir/actionlint.tar.gz" | sha256sum --check --strict
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_tools_dir/gitleaks.tar.gz" | sha256sum --check --strict
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $audit_tools_dir/trivy.tar.gz" | sha256sum --check --strict
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $audit_tools_dir/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xzf "$audit_tools_dir/actionlint.tar.gz" -C "$audit_tools_dir/actionlint-unpack"
          tar -xzf "$audit_tools_dir/gitleaks.tar.gz" -C "$audit_tools_dir/gitleaks-unpack"
          tar -xzf "$audit_tools_dir/trivy.tar.gz" -C "$audit_tools_dir/trivy-unpack"
          tar -xJf "$audit_tools_dir/shellcheck.tar.xz" -C "$audit_tools_dir/shellcheck-unpack"
          install -m 0755 "$audit_tools_dir/actionlint-unpack/actionlint" "$audit_tools_dir/actionlint"
          install -m 0755 "$audit_tools_dir/gitleaks-unpack/gitleaks" "$audit_tools_dir/gitleaks"
          install -m 0755 "$audit_tools_dir/trivy-unpack/trivy" "$audit_tools_dir/trivy"
          install -m 0755 \
            "$audit_tools_dir/shellcheck-unpack/shellcheck-v0.11.0/shellcheck" \
            "$audit_tools_dir/shellcheck"
          printf '%s\n' "$audit_tools_dir" >> "$GITHUB_PATH"

      - name: Run release static and secret audits
        shell: bash
        run: |
          set -euo pipefail
          actionlint -no-color
          mapfile -d '' shell_files < <(git ls-files -z -- '*.sh' '*.bash')
          if ((${#shell_files[@]})); then
            shellcheck "${shell_files[@]}"
          fi
          gitleaks detect --source . --no-banner --redact --exit-code 1
          trivy fs \
            --scanners vuln,secret,misconfig \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs .git \
            .

      - name: Lint and type-check the new runtime
        run: |
          uv run --all-packages ruff check \
            packages/cardrag-core \
            apps/cardrag-worker \
            apps/cardrag-mcp \
            tests/runtime_v1 \
            tools
          uv run --all-packages ruff format --check \
            packages/cardrag-core \
            apps/cardrag-worker \
            apps/cardrag-mcp \
            tests/runtime_v1 \
            tools
          uv run --all-packages mypy \
            packages/cardrag-core/src \
            apps/cardrag-worker/src \
            apps/cardrag-mcp/src

      - name: Run runtime tests
        run: |
          uv run --all-packages pytest \
            packages/cardrag-core/tests \
            apps/cardrag-worker/tests \
            apps/cardrag-mcp/tests \
            tests/runtime_v1

      - name: Validate the two-service deployment
        env:
          CARDRAG_WEBDAV_BASE_URL: https://webdav.example/cardrag
          CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL: https://cardrag.example
          # Non-secret, receipt-shaped fixtures used only to render the
          # digest-pinned candidate Compose overlays.
          CARDRAG_CANDIDATE_WORKER_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CARDRAG_CANDIDATE_MCP_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CARDRAG_WEBDAV_USERNAME_SECRET_FILE: /etc/hostname
          CARDRAG_WEBDAV_PASSWORD_SECRET_FILE: /etc/hostname
          CARDRAG_WEBDAV_CA_SECRET_FILE: /etc/ssl/certs/ca-certificates.crt
          CARDRAG_MCP_BEARER_TOKEN_SECRET_FILE: /etc/hostname
          CARDRAG_OPENROUTER_API_KEY_SECRET_FILE: /etc/hostname
          CARDRAG_MCP_PUBLIC_BASE_URL: https://cardrag.example
        run: |
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
            docker compose -f deploy/worker/compose.yaml config --quiet
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_MCP_BEARER_TOKEN=fixture-bearer-token-with-sufficient-length \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
            docker compose -f deploy/mcp/compose.yaml config --quiet
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
            docker compose \
              -f deploy/worker/compose.yaml \
              -f deploy/worker/compose.candidate.yaml \
              config --quiet
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
          CARDRAG_DOCUMENT_AGGREGATION_PROFILE_HOST_FILE=/etc/hostname \
          CARDRAG_DOCUMENT_AGGREGATION_PROFILE_ARTIFACT_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            docker compose \
              -f deploy/worker/compose.yaml \
              -f deploy/worker/compose.candidate.yaml \
              -f deploy/worker/compose.aggregation-profile.yaml \
              config --format json | \
            uv run python -c 'import json,sys; d=json.load(sys.stdin); s=d["services"]["worker"]; e=s["environment"]; assert d["name"]=="cardrag-v113-candidate"; assert e["CARDRAG_CHANNEL"]=="candidate-v1.0.11"; assert e["CARDRAG_DOCUMENT_AGGREGATION_PROFILE_FILE"]=="/run/secrets/document_aggregation_profile"; assert e["CARDRAG_DOCUMENT_AGGREGATION_PROFILE_ARTIFACT_SHA256"]=="a"*64; assert s["secrets"]==[{"source":"document_aggregation_profile","target":"document_aggregation_profile"}]; assert d["secrets"]["document_aggregation_profile"]["file"]=="/etc/hostname"'
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
            docker compose \
              -f deploy/worker/compose.yaml \
              -f deploy/worker/compose.candidate.yaml \
              -f deploy/worker/compose.cache-seed.yaml \
              config --quiet
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_MCP_BEARER_TOKEN=fixture-bearer-token-with-sufficient-length \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
          CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL=https://cardrag-v113.example \
            docker compose \
              -f deploy/mcp/compose.yaml \
              -f deploy/mcp/compose.candidate.yaml \
              config --quiet
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
          CARDRAG_EMBEDDING_REQUEST_MAX_ATTEMPTS=1 \
          CARDRAG_EMBEDDING_RETRY_BASE_SECONDS=999 \
          CARDRAG_EMBEDDING_RETRY_CAP_SECONDS=999 \
            docker compose \
              -f deploy/worker/compose.yaml \
              -f deploy/worker/compose.candidate.yaml \
              -f deploy/worker/compose.cache-seed.yaml \
              config --format json | \
            uv run python -c 'import json,sys; d=json.load(sys.stdin); s=d["services"]["worker"]; e=s["environment"]; v=d["volumes"]; assert d["name"]=="cardrag-v113-candidate"; assert e["CARDRAG_CHANNEL"]=="candidate-v1.0.11"; assert e["CARDRAG_WEBDAV_BASE_URL"]=="https://webdav.example/cardrag"; assert e["CARDRAG_COLLECT_REMOTE_GARBAGE"]=="false"; assert e["CARDRAG_EMBEDDING_MODEL"]=="qwen/qwen3-embedding-8b"; assert e["CARDRAG_EMBEDDING_DIMENSION"]=="4096"; assert e["CARDRAG_EMBEDDING_REQUEST_MAX_ATTEMPTS"]=="12"; assert e["CARDRAG_EMBEDDING_RETRY_BASE_SECONDS"]=="1"; assert e["CARDRAG_EMBEDDING_RETRY_CAP_SECONDS"]=="60"; assert v["worker-state"]["name"]=="cardrag-worker-v113-candidate-state"; assert v["codex-home"]["name"]=="cardrag-worker-v113-candidate-codex-home"; assert v["v109-worker-state"]=={"name":"cardrag-worker-v109-state","external":True}; m={x["target"]:x for x in s["volumes"]}; assert m["/mnt/cardrag-v109-state"]["read_only"] is True'
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_MCP_BEARER_TOKEN=fixture-bearer-token-with-sufficient-length \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
          CARDRAG_CANDIDATE_MCP_PUBLIC_BASE_URL=https://cardrag-v113.example \
            docker compose \
              -f deploy/mcp/compose.yaml \
              -f deploy/mcp/compose.candidate.yaml \
              config --format json | \
            uv run python -c 'import json,sys; d=json.load(sys.stdin); s=d["services"]["mcp"]; e=s["environment"]; p=s["ports"]; assert d["name"]=="cardrag-v113-candidate"; assert e["CARDRAG_CHANNEL"]=="candidate-v1.0.11"; assert e["CARDRAG_WEBDAV_BASE_URL"]=="https://webdav.example/cardrag"; assert e["CARDRAG_MCP_PUBLIC_BASE_URL"]=="https://cardrag-v113.example"; assert d["volumes"]["mcp-state"]["name"]=="cardrag-mcp-v113-candidate-state"; assert p==[{"mode":"ingress","host_ip":"127.0.0.1","target":8000,"published":"18013","protocol":"tcp"}]'
          docker compose \
            -f deploy/worker/compose.yaml \
            -f deploy/worker/compose.secrets.yaml \
            -f deploy/worker/compose.ca.yaml \
            config --quiet
          CARDRAG_LEGACY_ADOPTION_EXPORT_DIR=/tmp/cardrag-adoption-v2-export \
          CARDRAG_LEGACY_SOURCE_ROOT=/tmp/cardrag-legacy-source \
            docker compose \
              -f deploy/worker/compose.yaml \
              -f deploy/worker/compose.secrets.yaml \
              -f deploy/worker/compose.adoption.yaml \
              config --quiet
          docker compose \
            -f deploy/mcp/compose.yaml \
            -f deploy/mcp/compose.secrets.yaml \
            -f deploy/mcp/compose.ca.yaml \
            config --quiet
          services="$({ \
            CARDRAG_WEBDAV_USERNAME=fixture-user \
            CARDRAG_WEBDAV_PASSWORD=fixture-password \
            CARDRAG_MCP_BEARER_TOKEN=fixture-bearer-token-with-sufficient-length \
            CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
              docker compose -f compose.yaml config --services; \
          } | sort)"
          test "$services" = $'mcp\nworker'
          systemd-analyze verify \
            deploy/worker/cardrag-worker.service \
            deploy/worker/cardrag-worker.timer
          systemd-analyze calendar '*-*-* 03:00:00 Asia/Seoul' >/dev/null

      - name: Build exactly the Worker and MCP images
        run: |
          docker build --target worker -t cardrag-ci:worker .
          docker build --target mcp -t cardrag-ci:mcp .
          test "$(docker image inspect cardrag-ci:worker --format '{{index .Config.Entrypoint 0}}')" = cardrag-worker
          test "$(docker image inspect cardrag-ci:mcp --format '{{index .Config.Entrypoint 0}}')" = cardrag-mcp
          trivy image \
            --scanners vuln,secret \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            cardrag-ci:worker
          trivy image \
            --scanners vuln,secret \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            cardrag-ci:mcp
