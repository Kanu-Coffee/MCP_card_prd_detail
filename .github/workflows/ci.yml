name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install workspace
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv lock --check
          uv sync --frozen --all-packages --all-extras

      - name: Lint and type-check the new runtime
        run: |
          uv run --all-packages ruff check \
            packages/cardrag-core \
            apps/cardrag-worker \
            apps/cardrag-mcp \
            tests/runtime_v1 \
            tools
          uv run --all-packages ruff format --check \
            packages/cardrag-core \
            apps/cardrag-worker \
            apps/cardrag-mcp \
            tests/runtime_v1 \
            tools
          uv run --all-packages mypy \
            packages/cardrag-core/src \
            apps/cardrag-worker/src \
            apps/cardrag-mcp/src

      - name: Run runtime tests
        run: |
          uv run --all-packages pytest \
            packages/cardrag-core/tests \
            apps/cardrag-worker/tests \
            apps/cardrag-mcp/tests \
            tests/runtime_v1

      - name: Validate the two-service deployment
        env:
          CARDRAG_WEBDAV_BASE_URL: https://webdav.example/cardrag
          CARDRAG_WEBDAV_USERNAME_SECRET_FILE: /etc/hostname
          CARDRAG_WEBDAV_PASSWORD_SECRET_FILE: /etc/hostname
          CARDRAG_WEBDAV_CA_SECRET_FILE: /etc/ssl/certs/ca-certificates.crt
          CARDRAG_MCP_BEARER_TOKEN_SECRET_FILE: /etc/hostname
          CARDRAG_OPENROUTER_API_KEY_SECRET_FILE: /etc/hostname
          CARDRAG_MCP_PUBLIC_BASE_URL: https://cardrag.example
        run: |
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
            docker compose -f deploy/worker/compose.yaml config --quiet
          CARDRAG_WEBDAV_USERNAME=fixture-user \
          CARDRAG_WEBDAV_PASSWORD=fixture-password \
          CARDRAG_MCP_BEARER_TOKEN=fixture-bearer-token-with-sufficient-length \
          CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
            docker compose -f deploy/mcp/compose.yaml config --quiet
          docker compose \
            -f deploy/worker/compose.yaml \
            -f deploy/worker/compose.secrets.yaml \
            -f deploy/worker/compose.ca.yaml \
            config --quiet
          CARDRAG_LEGACY_ADOPTION_EXPORT_DIR=/tmp/cardrag-adoption-v2-export \
          CARDRAG_LEGACY_SOURCE_ROOT=/tmp/cardrag-legacy-source \
            docker compose \
              -f deploy/worker/compose.yaml \
              -f deploy/worker/compose.secrets.yaml \
              -f deploy/worker/compose.adoption.yaml \
              config --quiet
          docker compose \
            -f deploy/mcp/compose.yaml \
            -f deploy/mcp/compose.secrets.yaml \
            -f deploy/mcp/compose.ca.yaml \
            config --quiet
          services="$({ \
            CARDRAG_WEBDAV_USERNAME=fixture-user \
            CARDRAG_WEBDAV_PASSWORD=fixture-password \
            CARDRAG_MCP_BEARER_TOKEN=fixture-bearer-token-with-sufficient-length \
            CARDRAG_OPENROUTER_API_KEY=fixture-openrouter-key \
              docker compose -f compose.yaml config --services; \
          } | sort)"
          test "$services" = $'mcp\nworker'
          systemd-analyze verify \
            deploy/worker/cardrag-worker.service \
            deploy/worker/cardrag-worker.timer
          systemd-analyze calendar '*-*-* 03:00:00 Asia/Seoul' >/dev/null

      - name: Build exactly the Worker and MCP images
        run: |
          docker build --target worker -t cardrag-ci:worker .
          docker build --target mcp -t cardrag-ci:mcp .
          test "$(docker image inspect cardrag-ci:worker --format '{{index .Config.Entrypoint 0}}')" = cardrag-worker
          test "$(docker image inspect cardrag-ci:mcp --format '{{index .Config.Entrypoint 0}}')" = cardrag-mcp
