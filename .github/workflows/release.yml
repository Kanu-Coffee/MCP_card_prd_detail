name: Publish Worker and MCP images
run-name: Publish CardRAG v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing SemVer tag without the leading v"
        required: true
        type: string
      confirmation:
        description: "Enter PUBLISH-vX.Y.Z to authorize the public push"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-dockerhub-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ymtop59/mcp-card-prd-detail

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate immutable release source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          version=$REQUESTED_VERSION
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          test "$RELEASE_CONFIRMATION" = "PUBLISH-v$version"
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          paths = (
              Path("packages/cardrag-core/pyproject.toml"),
              Path("apps/cardrag-worker/pyproject.toml"),
              Path("apps/cardrag-mcp/pyproject.toml"),
          )
          versions = {tomllib.loads(path.read_text())["project"]["version"] for path in paths}
          assert versions == {expected}, (versions, expected)
          PY
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=completed -f per_page=100)
          jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<<"$runs" >/dev/null

  publish:
    runs-on: ubuntu-24.04
    needs: validate
    environment: dockerhub-public
    strategy:
      fail-fast: false
      matrix:
        target: [worker, mcp]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reject an existing immutable role tag
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output /tmp/tag.json --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}-${TARGET}")
          test "$status" = 404

      - name: Build and push role image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-${{ matrix.target }}
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-${{ matrix.target }}-sha-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Sign and verify immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "$reference"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$reference" > "cosign-${{ matrix.target }}.json"

      - name: Record role digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          jq -n \
            --arg role "$TARGET" --arg version "$VERSION" --arg git_sha "$GITHUB_SHA" \
            --arg image "$IMAGE_NAME" --arg digest "$DIGEST" \
            '{schema:"cardrag.container-release-part.v4",role:$role,version:$version,git_sha:$git_sha,image:$image,digest:$digest}' \
            > "release-${TARGET}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            release-${{ matrix.target }}.json
            cosign-${{ matrix.target }}.json
          if-no-files-found: error
