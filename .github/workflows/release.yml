name: Public image release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  actions: read
  contents: read

concurrency:
  group: public-dockerhub-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ymtop59/mcp-card-prd-detail

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate immutable SemVer release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be exactly vX.Y.Z" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Require successful full CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f per_page=100)
          if ! jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<<"$runs" >/dev/null; then
            echo "the exact release commit has no successful full CI workflow run" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test release source
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv lock --check
          uv sync --frozen --extra dev
          uv run --no-sync ruff check .
          uv run --no-sync mypy src/cardrag
          uv run --no-sync pytest -m "not integration and not live and not load"
          uv run --no-sync python scripts/run_fixture_quality.py \
            --output /tmp/cardrag-fixture-quality.json
          uv run --no-sync pytest -m load
          uv run --no-sync python scripts/run_local_load.py \
            --output /tmp/cardrag-local-load.json
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring:/monitoring:ro" \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /monitoring/cardrag-alerts.yml

  license-approval:
    runs-on: ubuntu-24.04
    needs: validate
    environment: dockerhub-public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Require exact protected dependency-license approval
        env:
          CARDRAG_DEPENDENCY_LICENSE_ATTESTATION: ${{ secrets.CARDRAG_DEPENDENCY_LICENSE_ATTESTATION }}
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv sync --frozen --extra dev
          uv run --no-sync python scripts/check_dependency_licenses.py \
            --release \
            --attestation "$CARDRAG_DEPENDENCY_LICENSE_ATTESTATION" \
            --output /tmp/cardrag-release-dependency-licenses.json

  publish:
    runs-on: ubuntu-24.04
    needs: [validate, license-approval]
    environment: dockerhub-public
    strategy:
      fail-fast: false
      matrix:
        target: [mcp, worker, admin]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Authenticate to Docker Hub after environment approval
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push public linux/amd64 role image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-${{ matrix.target }}
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-${{ matrix.target }}-sha-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=CardRAG ${{ matrix.target }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Keyless-sign pushed digest with GitHub Actions OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: cosign sign --yes --bundle "cosign-${TARGET}.bundle.json" "${IMAGE_NAME}@${DIGEST}"

      - name: Verify keyless signature identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Record immutable release manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema": "cardrag.container-release-part.v1",
              "role": os.environ["TARGET"],
              "image": os.environ["IMAGE_NAME"],
              "digest": os.environ["DIGEST"],
              "version": os.environ["VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "platforms": ["linux/amd64"],
              "tags": [
                  f'{os.environ["VERSION"]}-{os.environ["TARGET"]}',
                  f'{os.environ["VERSION"]}-{os.environ["TARGET"]}-sha-{os.environ["SHORT_SHA"]}',
              ],
              "signature": "github-actions-oidc-keyless-cosign",
              "signature_bundle": f'cosign-{os.environ["TARGET"]}.bundle.json',
              "workflow": os.environ["GITHUB_WORKFLOW_REF"],
          }
          Path(f'release-manifest-{os.environ["TARGET"]}.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-part-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            release-manifest-${{ matrix.target }}.json
            cosign-${{ matrix.target }}.bundle.json
          if-no-files-found: error

  publish-manifest:
    runs-on: ubuntu-24.04
    needs: [validate, publish]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-part-${{ needs.validate.outputs.version }}-*
          path: release-parts
          merge-multiple: true

      - name: Assemble all role digests and signature bundles
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("release-parts")
          parts = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(root.glob("release-manifest-*.json"))
          ]
          roles = {part["role"]: part for part in parts}
          assert set(roles) == {"mcp", "worker", "admin"}, roles
          assert all(part["version"] == os.environ["VERSION"] for part in parts)
          assert len({part["git_sha"] for part in parts}) == 1
          assert len({part["digest"] for part in parts}) == 3
          for role, part in roles.items():
              assert part["platforms"] == ["linux/amd64"]
              assert (root / part["signature_bundle"]).is_file(), role

          manifest = {
              "schema": "cardrag.container-release.v2",
              "image": os.environ["IMAGE_NAME"],
              "version": os.environ["VERSION"],
              "git_sha": parts[0]["git_sha"],
              "workflow": parts[0]["workflow"],
              "roles": {role: roles[role] for role in ("mcp", "worker", "admin")},
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ needs.validate.outputs.version }}
          path: |
            release-manifest.json
            release-parts/cosign-*.bundle.json
          if-no-files-found: error
