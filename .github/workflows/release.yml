name: Publish Worker and MCP images
run-name: Publish CardRAG v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing SemVer tag without the leading v"
        required: true
        type: string
      acceptance_report_sha256:
        description: "SHA-256 of the sealed release-evidence/vX.Y.Z gold evaluation report"
        required: true
        type: string
      aggregation_profile_sha256:
        description: "SHA-256 of the sealed v1.0.10 document aggregation profile artifact"
        required: true
        type: string
      capture_set_receipt_sha256:
        description: "SHA-256 of the five-lane binding receipt produced after source replay"
        required: true
        type: string
      candidate_source_commit:
        description: "Exact lowercase 40-hex candidate commit before the evidence-only sealing commit"
        required: true
        type: string
      candidate_acceptance_sha256:
        description: "SHA-256 of the canonical candidate acceptance receipt"
        required: true
        type: string
      candidate_worker_image_digest:
        description: "Receipt-bound Worker OCI index digest (sha256: followed by 64 lowercase hex)"
        required: true
        type: string
      candidate_mcp_image_digest:
        description: "Receipt-bound MCP OCI index digest (sha256: followed by 64 lowercase hex)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-dockerhub-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ymtop59/mcp-card-prd-detail
  CANDIDATE_IMAGE_REPOSITORY: ghcr.io/kanu-coffee/mcp-card-prd-detail-candidate
  IMMUTABLE_TAG_RULE: '^[0-9]+\.[0-9]+\.[0-9]+-(mcp|worker|admin)(-sha-[0-9a-f]{12})?$'

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      candidate_source_commit: ${{ steps.version.outputs.candidate_source_commit }}
      worker_digest: ${{ steps.version.outputs.worker_digest }}
      worker_platform_digest: ${{ steps.version.outputs.worker_platform_digest }}
      worker_config_digest: ${{ steps.version.outputs.worker_config_digest }}
      worker_attestation_digest: ${{ steps.version.outputs.worker_attestation_digest }}
      mcp_digest: ${{ steps.version.outputs.mcp_digest }}
      mcp_platform_digest: ${{ steps.version.outputs.mcp_platform_digest }}
      mcp_config_digest: ${{ steps.version.outputs.mcp_config_digest }}
      mcp_attestation_digest: ${{ steps.version.outputs.mcp_attestation_digest }}
      portable_evidence_manifest_sha256: ${{ steps.version.outputs.portable_evidence_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the checksum-pinned release validator environment
        run: |
          set -euo pipefail
          validator_tools_dir="$RUNNER_TEMP/cardrag-release-validator-tools"
          mkdir -p "$validator_tools_dir/unpack"
          curl --fail --location --silent --show-error \
            --output "$validator_tools_dir/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.8.17/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "920cbcaad514cc185634f6f0dcd71df5e8f4ee4456d440a22e0f8c0f142a8203  $validator_tools_dir/uv.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$validator_tools_dir/uv.tar.gz" -C "$validator_tools_dir/unpack"
          install -m 0755 \
            "$validator_tools_dir/unpack/uv-x86_64-unknown-linux-gnu/uv" \
            "$validator_tools_dir/uv"
          test "$("$validator_tools_dir/uv" --version)" = "uv 0.8.17"
          "$validator_tools_dir/uv" lock --check
          "$validator_tools_dir/uv" sync --frozen \
            --package cardrag-mcp --package cardrag-worker --no-dev

      - name: Validate immutable release source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          ACCEPTANCE_REPORT_SHA256: ${{ inputs.acceptance_report_sha256 }}
          AGGREGATION_PROFILE_SHA256: ${{ inputs.aggregation_profile_sha256 }}
          CAPTURE_SET_RECEIPT_SHA256: ${{ inputs.capture_set_receipt_sha256 }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          CANDIDATE_ACCEPTANCE_SHA256: ${{ inputs.candidate_acceptance_sha256 }}
          CANDIDATE_WORKER_IMAGE_DIGEST: ${{ inputs.candidate_worker_image_digest }}
          CANDIDATE_MCP_IMAGE_DIGEST: ${{ inputs.candidate_mcp_image_digest }}
        run: |
          set -euo pipefail
          version=$REQUESTED_VERSION
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git cat-file -t "refs/tags/v$version")" = tag
          if [[ "$version" == "1.0.10" ]]; then
            evidence_dir="release-evidence/v${version}"
            evidence_dir=$(realpath --canonicalize-existing "$evidence_dir")
            acceptance_report="$evidence_dir/gold-evaluation-report.json"
            aggregation_profile="$evidence_dir/document-aggregation-profile.json"
            aggregation_scores="$evidence_dir/document-aggregation-scores.jsonl"
            aggregation_corpus_inventory="$evidence_dir/document-aggregation-corpus-inventory.jsonl"
            aggregation_score_matrix="$evidence_dir/document-aggregation-score-matrix.f32"
            aggregation_query_vector_matrix="$evidence_dir/document-aggregation-query-vectors.f32"
            capture_set_receipt="$evidence_dir/gold-capture-set-receipt.json"
            candidate_acceptance="$evidence_dir/candidate-acceptance-receipt.json"
            serving_generation_manifest="$evidence_dir/serving-generation-manifest.json"
            legacy_historical="$evidence_dir/v109-kb-real-regression-baseline.json"
            legacy_historical_source="$evidence_dir/v109-structure-audit-execution.json"
            legacy_reaudit="$evidence_dir/v109-kb-v4-structure-reaudit.json"
            portable_evidence_relative_paths=(
              candidate-acceptance-receipt.json
              gold-evaluation-report.json
              gold-capture-set-receipt.json
              gold.jsonl
              blind-evaluation.jsonl
              document-aggregation-profile.json
              document-aggregation-scores.jsonl
              document-aggregation-corpus-inventory.jsonl
              document-aggregation-score-matrix.f32
              document-aggregation-query-vectors.f32
              serving-generation-manifest.json
              v109-kb-real-regression-baseline.json
              v109-structure-audit-execution.json
              v109-kb-v4-structure-reaudit.json
              v109_baseline.jsonl
              qwen_page.jsonl
              qwen_structure_exact.jsonl
              lexical_shadow.jsonl
              reranker_shadow.jsonl
              v109_baseline.capture-receipt.json
              qwen_page.capture-receipt.json
              qwen_structure_exact.capture-receipt.json
              lexical_shadow.capture-receipt.json
              reranker_shadow.capture-receipt.json
              v109_baseline.capture-attestation.jsonl
              qwen_page.capture-attestation.jsonl
              native-v5-attestation.jsonl
              v109_baseline.corpus.jsonl
              v109_baseline.dense-scores.f32
              v109_baseline.query-vectors.f32
              v109_baseline.lexical-ranks.jsonl
              qwen_page.corpus.jsonl
              qwen_page.dense-scores.f32
              qwen_page.query-vectors.f32
              answers/v109_baseline.input.jsonl
              answers/v109_baseline.producer-receipt.json
              answers/v109_baseline.answers.jsonl
              answers/v109_baseline.call-ledger.jsonl
              answers/v109_baseline.state-identity.json
              answers/v109_baseline.state-bundle.jsonl
              answers/qwen_page.input.jsonl
              answers/qwen_page.producer-receipt.json
              answers/qwen_page.answers.jsonl
              answers/qwen_page.call-ledger.jsonl
              answers/qwen_page.state-identity.json
              answers/qwen_page.state-bundle.jsonl
              answers/qwen_structure_exact.input.jsonl
              answers/qwen_structure_exact.producer-receipt.json
              answers/qwen_structure_exact.answers.jsonl
              answers/qwen_structure_exact.call-ledger.jsonl
              answers/qwen_structure_exact.state-identity.json
              answers/qwen_structure_exact.state-bundle.jsonl
              bootstrap/v109_baseline.jsonl
              bootstrap/v109_baseline.capture-receipt.json
              bootstrap/qwen_page.jsonl
              bootstrap/qwen_page.capture-receipt.json
              bootstrap/qwen_structure_exact.jsonl
              bootstrap/qwen_structure_exact.capture-receipt.json
              bootstrap/native-v5-attestation.jsonl
            )
            [[ "$ACCEPTANCE_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$AGGREGATION_PROFILE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CAPTURE_SET_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CANDIDATE_ACCEPTANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_WORKER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_MCP_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$CANDIDATE_SOURCE_COMMIT" != "$GITHUB_SHA"
            git merge-base --is-ancestor "$CANDIDATE_SOURCE_COMMIT" "$GITHUB_SHA"
            portable_artifact_dir="$RUNNER_TEMP/cardrag-portable-evidence"
            portable_validation_dir="$RUNNER_TEMP/cardrag-portable-validation-evidence"
            portable_evidence_manifest_sha256=$(
              python - \
                "$evidence_dir" \
                "$portable_artifact_dir" \
                "$portable_validation_dir" \
                "$CANDIDATE_SOURCE_COMMIT" \
                "$GITHUB_SHA" \
                "${portable_evidence_relative_paths[@]}" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path, PurePosixPath

          MAX_FILE_BYTES = 95_000_000
          MAX_MANIFEST_BYTES = 2 * 1024 * 1024
          DIRECTORY_FLAGS = os.O_RDONLY | os.O_DIRECTORY | getattr(os, "O_NOFOLLOW", 0)
          READ_FLAGS = os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0)
          CREATE_FLAGS = (
              os.O_RDWR | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
          )


          def identity(value: os.stat_result) -> tuple[int, ...]:
              return (
                  value.st_dev,
                  value.st_ino,
                  value.st_mode,
                  value.st_nlink,
                  value.st_size,
                  value.st_mtime_ns,
                  value.st_ctime_ns,
              )


          def require_directory(value: os.stat_result) -> None:
              assert stat.S_ISDIR(value.st_mode)


          def require_regular(value: os.stat_result, *, maximum_bytes: int) -> None:
              assert stat.S_ISREG(value.st_mode)
              assert value.st_nlink == 1
              assert 0 < value.st_size <= maximum_bytes


          def reject_duplicate_keys(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result = {}
              for key, value in pairs:
                  assert key not in result
                  result[key] = value
              return result


          def strict_json(payload: bytes) -> object:
              return json.loads(
                  payload,
                  object_pairs_hook=reject_duplicate_keys,
                  parse_constant=lambda value: (_ for _ in ()).throw(ValueError(value)),
              )


          def open_root(path: Path) -> tuple[int, tuple[int, ...]]:
              listed = path.lstat()
              require_directory(listed)
              descriptor = os.open(path, DIRECTORY_FLAGS)
              assert identity(os.fstat(descriptor)) == identity(listed)
              return descriptor, identity(listed)


          def open_parent(
              root_descriptor: int, relative: PurePosixPath
          ) -> tuple[int, str, list[int], list[tuple[int, str, int, tuple[int, ...]]]]:
              assert not relative.is_absolute() and relative.parts
              assert ".." not in relative.parts and "." not in relative.parts
              descriptors = [os.dup(root_descriptor)]
              checkpoints = []
              for component in relative.parts[:-1]:
                  parent = descriptors[-1]
                  listed = os.stat(component, dir_fd=parent, follow_symlinks=False)
                  require_directory(listed)
                  child = os.open(component, DIRECTORY_FLAGS, dir_fd=parent)
                  expected = identity(listed)
                  assert identity(os.fstat(child)) == expected
                  checkpoints.append((parent, component, child, expected))
                  descriptors.append(child)
              return descriptors[-1], relative.parts[-1], descriptors, checkpoints


          def verify_directories(
              checkpoints: list[tuple[int, str, int, tuple[int, ...]]]
          ) -> None:
              for parent, component, child, expected in reversed(checkpoints):
                  assert identity(os.fstat(child)) == expected
                  assert identity(
                      os.stat(component, dir_fd=parent, follow_symlinks=False)
                  ) == expected


          def write_all(descriptor: int, payload: bytes) -> None:
              view = memoryview(payload)
              while view:
                  written = os.write(descriptor, view)
                  assert written > 0
                  view = view[written:]


          def hash_pinned_descriptor(
              descriptor: int, *, maximum_bytes: int
          ) -> tuple[str, int]:
              os.lseek(descriptor, 0, os.SEEK_SET)
              digest = hashlib.sha256()
              size = 0
              while chunk := os.read(descriptor, 1024 * 1024):
                  size += len(chunk)
                  assert size <= maximum_bytes
                  digest.update(chunk)
              return digest.hexdigest(), size


          def inspect_source(
              root_descriptor: int,
              raw_relative: str,
              *,
              first_line: bool = False,
          ) -> tuple[str, int, bytes | None]:
              relative = PurePosixPath(raw_relative)
              parent, leaf, descriptors, checkpoints = open_parent(
                  root_descriptor, relative
              )
              try:
                  listed = os.stat(leaf, dir_fd=parent, follow_symlinks=False)
                  require_regular(listed, maximum_bytes=MAX_FILE_BYTES)
                  expected = identity(listed)
                  source = os.open(leaf, READ_FLAGS, dir_fd=parent)
                  try:
                      assert identity(os.fstat(source)) == expected
                      digest = hashlib.sha256()
                      size = 0
                      line = bytearray()
                      found_newline = not first_line
                      while chunk := os.read(source, 1024 * 1024):
                          size += len(chunk)
                          assert size <= MAX_FILE_BYTES
                          digest.update(chunk)
                          if not found_newline:
                              newline = chunk.find(b"\n")
                              if newline < 0:
                                  line.extend(chunk)
                                  assert len(line) <= MAX_MANIFEST_BYTES
                              else:
                                  line.extend(chunk[:newline])
                                  found_newline = True
                      assert size == listed.st_size and (found_newline or not first_line)
                      assert identity(os.fstat(source)) == expected
                      assert identity(
                          os.stat(leaf, dir_fd=parent, follow_symlinks=False)
                      ) == expected
                      verify_directories(checkpoints)
                      return digest.hexdigest(), size, bytes(line) if first_line else None
                  finally:
                      os.close(source)
              finally:
                  for descriptor in reversed(descriptors):
                      os.close(descriptor)


          def copy_source(
              source_root: int,
              raw_relative: str,
              destination_directory: int,
              destination_name: str,
          ) -> tuple[str, int]:
              relative = PurePosixPath(raw_relative)
              parent, leaf, descriptors, checkpoints = open_parent(
                  source_root, relative
              )
              try:
                  listed = os.stat(leaf, dir_fd=parent, follow_symlinks=False)
                  require_regular(listed, maximum_bytes=MAX_FILE_BYTES)
                  expected_source = identity(listed)
                  source = os.open(leaf, READ_FLAGS, dir_fd=parent)
                  destination = os.open(
                      destination_name,
                      CREATE_FLAGS,
                      0o600,
                      dir_fd=destination_directory,
                  )
                  try:
                      assert identity(os.fstat(source)) == expected_source
                      digest = hashlib.sha256()
                      size = 0
                      while chunk := os.read(source, 1024 * 1024):
                          size += len(chunk)
                          assert size <= MAX_FILE_BYTES
                          digest.update(chunk)
                          write_all(destination, chunk)
                      os.fsync(destination)
                      assert size == listed.st_size
                      assert identity(os.fstat(source)) == expected_source
                      assert identity(
                          os.stat(leaf, dir_fd=parent, follow_symlinks=False)
                      ) == expected_source
                      verify_directories(checkpoints)
                      sealed_destination = identity(os.fstat(destination))
                      require_regular(
                          os.fstat(destination), maximum_bytes=MAX_FILE_BYTES
                      )
                      copied_sha256, copied_size = hash_pinned_descriptor(
                          destination, maximum_bytes=MAX_FILE_BYTES
                      )
                      assert (copied_sha256, copied_size) == (digest.hexdigest(), size)
                      assert identity(os.fstat(destination)) == sealed_destination
                      assert identity(
                          os.stat(
                              destination_name,
                              dir_fd=destination_directory,
                              follow_symlinks=False,
                          )
                      ) == sealed_destination
                      return digest.hexdigest(), size
                  finally:
                      os.close(destination)
                      os.close(source)
              finally:
                  for descriptor in reversed(descriptors):
                      os.close(descriptor)


          def write_new_file(
              directory: int, name: str, payload: bytes, *, maximum_bytes: int
          ) -> str:
              assert 0 < len(payload) <= maximum_bytes
              descriptor = os.open(name, CREATE_FLAGS, 0o600, dir_fd=directory)
              try:
                  write_all(descriptor, payload)
                  os.fsync(descriptor)
                  sealed = identity(os.fstat(descriptor))
                  require_regular(os.fstat(descriptor), maximum_bytes=maximum_bytes)
                  digest, size = hash_pinned_descriptor(
                      descriptor, maximum_bytes=maximum_bytes
                  )
                  assert size == len(payload) and digest == hashlib.sha256(payload).hexdigest()
                  assert identity(os.fstat(descriptor)) == sealed
                  assert identity(
                      os.stat(name, dir_fd=directory, follow_symlinks=False)
                  ) == sealed
                  return digest
              finally:
                  os.close(descriptor)


          def create_parent(
              root: int, relative: PurePosixPath
          ) -> tuple[int, str, list[int]]:
              assert not relative.is_absolute() and relative.parts
              assert ".." not in relative.parts and "." not in relative.parts
              descriptors = [os.dup(root)]
              for component in relative.parts[:-1]:
                  parent = descriptors[-1]
                  try:
                      listed = os.stat(
                          component, dir_fd=parent, follow_symlinks=False
                      )
                  except FileNotFoundError:
                      os.mkdir(component, 0o700, dir_fd=parent)
                      listed = os.stat(
                          component, dir_fd=parent, follow_symlinks=False
                      )
                  require_directory(listed)
                  child = os.open(component, DIRECTORY_FLAGS, dir_fd=parent)
                  assert identity(os.fstat(child)) == identity(listed)
                  descriptors.append(child)
              return descriptors[-1], relative.parts[-1], descriptors


          evidence_root = Path(sys.argv[1])
          artifact_root = Path(sys.argv[2])
          validation_root = Path(sys.argv[3])
          source_commit = sys.argv[4]
          tag_commit = sys.argv[5]
          relative_paths = list(sys.argv[6:])
          assert relative_paths and len(relative_paths) == len(set(relative_paths))
          source_root, source_root_identity = open_root(evidence_root)
          artifact_parent, _artifact_parent_identity = open_root(artifact_root.parent)
          try:
              try:
                  os.stat(
                      artifact_root.name,
                      dir_fd=artifact_parent,
                      follow_symlinks=False,
                  )
              except FileNotFoundError:
                  pass
              else:
                  raise AssertionError("portable artifact root already exists")
              os.mkdir(artifact_root.name, 0o700, dir_fd=artifact_parent)
              artifact_listed = os.stat(
                  artifact_root.name, dir_fd=artifact_parent, follow_symlinks=False
              )
              require_directory(artifact_listed)
              artifact_directory = os.open(
                  artifact_root.name, DIRECTORY_FLAGS, dir_fd=artifact_parent
              )
              assert identity(os.fstat(artifact_directory)) == identity(artifact_listed)
              os.mkdir("files", 0o700, dir_fd=artifact_directory)
              files_listed = os.stat(
                  "files", dir_fd=artifact_directory, follow_symlinks=False
              )
              require_directory(files_listed)
              files_directory = os.open(
                  "files", DIRECTORY_FLAGS, dir_fd=artifact_directory
              )
              assert validation_root.parent == artifact_root.parent
              try:
                  os.stat(
                      validation_root.name,
                      dir_fd=artifact_parent,
                      follow_symlinks=False,
                  )
              except FileNotFoundError:
                  pass
              else:
                  raise AssertionError("portable validation root already exists")
              os.mkdir(validation_root.name, 0o700, dir_fd=artifact_parent)
              validation_listed = os.stat(
                  validation_root.name,
                  dir_fd=artifact_parent,
                  follow_symlinks=False,
              )
              require_directory(validation_listed)
              validation_directory = os.open(
                  validation_root.name,
                  DIRECTORY_FLAGS,
                  dir_fd=artifact_parent,
              )
              assert identity(os.fstat(validation_directory)) == identity(
                  validation_listed
              )
              try:
                  generation_sha256s = set()
                  for lane in (
                      "v109_baseline",
                      "qwen_page",
                      "qwen_structure_exact",
                      "lexical_shadow",
                      "reranker_shadow",
                  ):
                      _sha256, _size, first_line = inspect_source(
                          source_root, f"{lane}.jsonl", first_line=True
                      )
                      assert first_line is not None
                      run_manifest = strict_json(first_line)
                      assert isinstance(run_manifest, dict)
                      generation_sha256 = run_manifest["generation_manifest_sha256"]
                      assert isinstance(generation_sha256, str)
                      assert len(generation_sha256) == 64
                      assert set(generation_sha256) <= set("0123456789abcdef")
                      generation_sha256s.add(generation_sha256)
                  _receipt_sha256, _receipt_size, receipt_line = inspect_source(
                      source_root,
                      "candidate-acceptance-receipt.json",
                      first_line=True,
                  )
                  assert receipt_line is not None
                  candidate_receipt = strict_json(receipt_line)
                  assert isinstance(candidate_receipt, dict)
                  assert set(candidate_receipt) == {
                      "channel",
                      "compose_project",
                      "evidence",
                      "generation_id",
                      "issuers",
                      "release_eligible",
                      "release_version",
                      "schema_version",
                      "source_commit",
                  }
                  assert candidate_receipt["schema_version"] == (
                      "cardrag.candidate-acceptance-receipt.v1"
                  )
                  assert candidate_receipt["source_commit"] == source_commit
                  evidence_bindings = candidate_receipt["evidence"]
                  expected_evidence_keys = {
                      "candidate_pointer",
                      "effective_config",
                      "generation_cas",
                      "generation_manifest",
                      "generation_ready",
                      "mcp_smoke",
                      "native_cache_after",
                      "native_cache_audit",
                      "native_cache_before",
                      "rollback_ledger",
                      "v109_identity",
                      "worker_metrics",
                  }
                  assert isinstance(evidence_bindings, dict)
                  assert set(evidence_bindings) == expected_evidence_keys
                  candidate_artifacts = {}
                  for binding in evidence_bindings.values():
                      assert isinstance(binding, dict) and set(binding) == {
                          "path",
                          "sha256",
                          "size_bytes",
                      }
                      candidate_path = binding["path"]
                      assert isinstance(candidate_path, str) and candidate_path
                      candidate_relative = PurePosixPath(candidate_path)
                      assert not candidate_relative.is_absolute()
                      assert ".." not in candidate_relative.parts
                      candidate_sha256 = binding["sha256"]
                      candidate_size = binding["size_bytes"]
                      assert isinstance(candidate_sha256, str)
                      assert len(candidate_sha256) == 64
                      assert set(candidate_sha256) <= set("0123456789abcdef")
                      assert isinstance(candidate_size, int)
                      assert 0 < candidate_size <= MAX_FILE_BYTES
                      assert candidate_path not in candidate_artifacts
                      candidate_artifacts[candidate_path] = (
                          candidate_sha256,
                          candidate_size,
                      )
                  dynamic_paths = [
                      *(f"generation-manifests/{sha256}.json" for sha256 in sorted(generation_sha256s)),
                      *sorted(candidate_artifacts),
                  ]
                  for dynamic_path in dynamic_paths:
                      if dynamic_path not in relative_paths:
                          relative_paths.append(dynamic_path)
                  assert len(relative_paths) == len(set(relative_paths))
                  entries = []
                  asset_names = set()
                  for raw_relative in relative_paths:
                      relative = PurePosixPath(raw_relative)
                      assert not relative.is_absolute() and ".." not in relative.parts
                      asset_name = (
                          "evaluation-evidence--" + raw_relative.replace("/", "--")
                      )
                      assert "/" not in asset_name and asset_name not in asset_names
                      asset_names.add(asset_name)
                      digest, size = copy_source(
                          source_root,
                          raw_relative,
                          files_directory,
                          asset_name,
                      )
                      candidate_binding = candidate_artifacts.get(raw_relative)
                      if candidate_binding is not None:
                          assert (digest, size) == candidate_binding
                      snapshot_parent, snapshot_leaf, snapshot_descriptors = create_parent(
                          validation_directory,
                          relative,
                      )
                      try:
                          os.link(
                              asset_name,
                              snapshot_leaf,
                              src_dir_fd=files_directory,
                              dst_dir_fd=snapshot_parent,
                              follow_symlinks=False,
                          )
                          snapshot_listed = os.stat(
                              snapshot_leaf,
                              dir_fd=snapshot_parent,
                              follow_symlinks=False,
                          )
                          assert stat.S_ISREG(snapshot_listed.st_mode)
                          assert snapshot_listed.st_nlink == 2
                          snapshot_descriptor = os.open(
                              snapshot_leaf,
                              READ_FLAGS,
                              dir_fd=snapshot_parent,
                          )
                          try:
                              os.fchmod(snapshot_descriptor, 0o400)
                              sealed_snapshot = identity(os.fstat(snapshot_descriptor))
                              assert sealed_snapshot[3] == 2
                              assert identity(
