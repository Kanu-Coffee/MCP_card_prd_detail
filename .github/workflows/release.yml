name: Publish Worker and MCP images
run-name: Publish CardRAG v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing SemVer tag without the leading v"
        required: true
        type: string
      acceptance_report_sha256:
        description: "SHA-256 of the sealed release-evidence/vX.Y.Z gold evaluation report"
        required: true
        type: string
      aggregation_profile_sha256:
        description: "SHA-256 of the sealed v1.0.10 document aggregation profile artifact"
        required: true
        type: string
      capture_set_receipt_sha256:
        description: "SHA-256 of the five-lane binding receipt produced after source replay"
        required: true
        type: string
      candidate_source_commit:
        description: "Exact lowercase 40-hex candidate commit before the evidence-only sealing commit"
        required: true
        type: string
      candidate_acceptance_sha256:
        description: "SHA-256 of the canonical candidate acceptance receipt"
        required: true
        type: string
      candidate_worker_image_digest:
        description: "Receipt-bound Worker OCI index digest (sha256: followed by 64 lowercase hex)"
        required: true
        type: string
      candidate_mcp_image_digest:
        description: "Receipt-bound MCP OCI index digest (sha256: followed by 64 lowercase hex)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-dockerhub-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ymtop59/mcp-card-prd-detail
  CANDIDATE_IMAGE_REPOSITORY: ghcr.io/kanu-coffee/mcp-card-prd-detail-candidate
  IMMUTABLE_TAG_RULE: '^[0-9]+\.[0-9]+\.[0-9]+-(mcp|worker|admin)(-sha-[0-9a-f]{12})?$'

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      candidate_source_commit: ${{ steps.version.outputs.candidate_source_commit }}
      worker_digest: ${{ steps.version.outputs.worker_digest }}
      worker_platform_digest: ${{ steps.version.outputs.worker_platform_digest }}
      worker_config_digest: ${{ steps.version.outputs.worker_config_digest }}
      worker_attestation_digest: ${{ steps.version.outputs.worker_attestation_digest }}
      mcp_digest: ${{ steps.version.outputs.mcp_digest }}
      mcp_platform_digest: ${{ steps.version.outputs.mcp_platform_digest }}
      mcp_config_digest: ${{ steps.version.outputs.mcp_config_digest }}
      mcp_attestation_digest: ${{ steps.version.outputs.mcp_attestation_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the checksum-pinned release validator environment
        run: |
          set -euo pipefail
          validator_tools_dir="$RUNNER_TEMP/cardrag-release-validator-tools"
          mkdir -p "$validator_tools_dir/unpack"
          curl --fail --location --silent --show-error \
            --output "$validator_tools_dir/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.8.17/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "920cbcaad514cc185634f6f0dcd71df5e8f4ee4456d440a22e0f8c0f142a8203  $validator_tools_dir/uv.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$validator_tools_dir/uv.tar.gz" -C "$validator_tools_dir/unpack"
          install -m 0755 \
            "$validator_tools_dir/unpack/uv-x86_64-unknown-linux-gnu/uv" \
            "$validator_tools_dir/uv"
          test "$("$validator_tools_dir/uv" --version)" = "uv 0.8.17"
          "$validator_tools_dir/uv" lock --check
          "$validator_tools_dir/uv" sync --frozen \
            --package cardrag-mcp --package cardrag-worker --no-dev

      - name: Validate immutable release source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          ACCEPTANCE_REPORT_SHA256: ${{ inputs.acceptance_report_sha256 }}
          AGGREGATION_PROFILE_SHA256: ${{ inputs.aggregation_profile_sha256 }}
          CAPTURE_SET_RECEIPT_SHA256: ${{ inputs.capture_set_receipt_sha256 }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          CANDIDATE_ACCEPTANCE_SHA256: ${{ inputs.candidate_acceptance_sha256 }}
          CANDIDATE_WORKER_IMAGE_DIGEST: ${{ inputs.candidate_worker_image_digest }}
          CANDIDATE_MCP_IMAGE_DIGEST: ${{ inputs.candidate_mcp_image_digest }}
        run: |
          set -euo pipefail
          version=$REQUESTED_VERSION
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git cat-file -t "refs/tags/v$version")" = tag
          if [[ "$version" == "1.0.10" ]]; then
            evidence_dir="release-evidence/v${version}"
            evidence_dir=$(realpath --canonicalize-existing "$evidence_dir")
            acceptance_report="$evidence_dir/gold-evaluation-report.json"
            aggregation_profile="$evidence_dir/document-aggregation-profile.json"
            aggregation_scores="$evidence_dir/document-aggregation-scores.jsonl"
            capture_set_receipt="$evidence_dir/gold-capture-set-receipt.json"
            candidate_acceptance="$evidence_dir/candidate-acceptance-receipt.json"
            serving_generation_manifest="$evidence_dir/serving-generation-manifest.json"
            legacy_historical="$evidence_dir/v109-kb-real-regression-baseline.json"
            legacy_historical_source="$evidence_dir/v109-structure-audit-execution.json"
            legacy_reaudit="$evidence_dir/v109-kb-v4-structure-reaudit.json"
            [[ "$ACCEPTANCE_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$AGGREGATION_PROFILE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CAPTURE_SET_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CANDIDATE_ACCEPTANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_WORKER_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$CANDIDATE_MCP_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$CANDIDATE_SOURCE_COMMIT" != "$GITHUB_SHA"
            git merge-base --is-ancestor "$CANDIDATE_SOURCE_COMMIT" "$GITHUB_SHA"
            mapfile -d '' candidate_evidence_paths < <(
              git diff --name-only -z "$CANDIDATE_SOURCE_COMMIT" "$GITHUB_SHA"
            )
            ((${#candidate_evidence_paths[@]} > 0))
            git diff --quiet "$CANDIDATE_SOURCE_COMMIT" "$GITHUB_SHA" -- \
              . ':(exclude)release-evidence/v1.0.10/**'
            for evidence_path in "${candidate_evidence_paths[@]}"; do
              case "$evidence_path" in
                release-evidence/v1.0.10/*) ;;
                *)
                  echo "non-evidence change after candidate source: $evidence_path" >&2
                  exit 1
                  ;;
              esac
            done
            test "$(sha256sum "$candidate_acceptance" | awk '{print $1}')" = \
              "$CANDIDATE_ACCEPTANCE_SHA256"
            candidate_validation=$(.venv/bin/python -m cardrag_core.candidate_acceptance \
              --receipt "$candidate_acceptance" \
              --evidence-root "$evidence_dir" \
              --expected-receipt-sha256 "$CANDIDATE_ACCEPTANCE_SHA256" \
              --expected-source-commit "$CANDIDATE_SOURCE_COMMIT" \
              --expected-image-repository "$CANDIDATE_IMAGE_REPOSITORY")
            test "$(jq -r '.schema_version' <<<"$candidate_validation")" = \
              "cardrag.candidate-acceptance-validation.v1"
            test "$(jq -r '.status' <<<"$candidate_validation")" = validated
            test "$(jq -r '.source_commit' <<<"$candidate_validation")" = \
              "$CANDIDATE_SOURCE_COMMIT"
            test "$(jq -r '.worker_image.repository' <<<"$candidate_validation")" = \
              "$CANDIDATE_IMAGE_REPOSITORY"
            test "$(jq -r '.mcp_image.repository' <<<"$candidate_validation")" = \
              "$CANDIDATE_IMAGE_REPOSITORY"
            test "$(jq -r '.worker_image.digest' <<<"$candidate_validation")" = \
              "$CANDIDATE_WORKER_IMAGE_DIGEST"
            test "$(jq -r '.mcp_image.digest' <<<"$candidate_validation")" = \
              "$CANDIDATE_MCP_IMAGE_DIGEST"
            worker_platform_digest=$(jq -r '.worker_image.platform_manifest_digest' \
              <<<"$candidate_validation")
            worker_config_digest=$(jq -r '.worker_image.platform_config_digest' \
              <<<"$candidate_validation")
            worker_attestation_digest=$(jq -r '.worker_image.attestation_manifest_digest' \
              <<<"$candidate_validation")
            mcp_platform_digest=$(jq -r '.mcp_image.platform_manifest_digest' \
              <<<"$candidate_validation")
            mcp_config_digest=$(jq -r '.mcp_image.platform_config_digest' \
              <<<"$candidate_validation")
            mcp_attestation_digest=$(jq -r '.mcp_image.attestation_manifest_digest' \
              <<<"$candidate_validation")
            [[ "$worker_platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$worker_config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$worker_attestation_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$mcp_platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$mcp_config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$mcp_attestation_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(sha256sum "$capture_set_receipt" | awk '{print $1}')" = \
              "$CAPTURE_SET_RECEIPT_SHA256"
            .venv/bin/python -m cardrag_worker.legacy_v4_audit \
              --validate-release-artifact "$legacy_reaudit" \
              --historical-artifact "$legacy_historical" \
              --historical-source-artifact "$legacy_historical_source"
            .venv/bin/python -m cardrag_mcp.aggregation_profile \
              --gold "$evidence_dir/gold.jsonl" \
              --scores "$aggregation_scores" \
              --validate-profile "$aggregation_profile" \
              --expected-profile-sha256 "$AGGREGATION_PROFILE_SHA256" \
              --generation-manifest-dir "$evidence_dir/generation-manifests" \
              --serving-generation-manifest "$serving_generation_manifest" \
              --expected-source-commit "$CANDIDATE_SOURCE_COMMIT" \
              --bootstrap-samples 2000 \
              --bootstrap-seed 1010
            validator_args=(
              --gold "$evidence_dir/gold.jsonl"
              --blind-evaluation "$evidence_dir/blind-evaluation.jsonl"
              --validate-report "$acceptance_report"
              --expected-report-sha256 "$ACCEPTANCE_REPORT_SHA256"
              --generation-manifest-dir "$evidence_dir/generation-manifests"
              --expected-source-commit "$CANDIDATE_SOURCE_COMMIT"
              --bootstrap-samples 2000
              --bootstrap-seed 1010
            )
            for lane in \
              v109_baseline \
              qwen_page \
              qwen_structure_exact \
              lexical_shadow \
              reranker_shadow; do
              validator_args+=(--run "$lane=$evidence_dir/$lane.jsonl")
            done
            .venv/bin/python -m cardrag_mcp.evaluation "${validator_args[@]}"
            gold_sha256=$(sha256sum "$evidence_dir/gold.jsonl" | awk '{print $1}')
            capture_args=(
              validate-set
              --gold "$evidence_dir/gold.jsonl"
              --expected-gold-sha256 "$gold_sha256"
              --native-score-artifact "$aggregation_scores"
              --expected-source-commit "$CANDIDATE_SOURCE_COMMIT"
              --output "$capture_set_receipt"
            )
            for lane in \
              v109_baseline \
              qwen_page \
              qwen_structure_exact \
              lexical_shadow \
              reranker_shadow; do
              lane_receipt="$evidence_dir/$lane.capture-receipt.json"
              lane_receipt_sha256=$(sha256sum "$lane_receipt" | awk '{print $1}')
              capture_args+=(
                --run "$lane=$evidence_dir/$lane.jsonl"
                --receipt "$lane=$lane_receipt"
                --expected-receipt-sha256 "$lane=$lane_receipt_sha256"
              )
              if [[ "$lane" == "v109_baseline" || "$lane" == "qwen_page" ]]; then
                capture_args+=(
                  --attestation "$lane=$evidence_dir/$lane.capture-attestation.jsonl"
                )
              else
                capture_args+=(
                  --attestation "$lane=$evidence_dir/native-v5-attestation.jsonl"
                )
              fi
            done
            # validate-set revalidates canonical bindings; it does not replay the
            # source DB/vector/provider capture and cannot prove replay by itself.
            # This digest is a release trust root only when source replay evidence
            # is complete and sealed before the evidence-only commit.
            .venv/bin/python -m cardrag_mcp.gold_capture "${capture_args[@]}"
            test "$(sha256sum "$capture_set_receipt" | awk '{print $1}')" = \
              "$CAPTURE_SET_RECEIPT_SHA256"
            {
              echo "candidate_source_commit=$CANDIDATE_SOURCE_COMMIT"
              echo "short_sha=${CANDIDATE_SOURCE_COMMIT::12}"
              echo "worker_digest=$CANDIDATE_WORKER_IMAGE_DIGEST"
              echo "worker_platform_digest=$worker_platform_digest"
              echo "worker_config_digest=$worker_config_digest"
              echo "worker_attestation_digest=$worker_attestation_digest"
              echo "mcp_digest=$CANDIDATE_MCP_IMAGE_DIGEST"
              echo "mcp_platform_digest=$mcp_platform_digest"
              echo "mcp_config_digest=$mcp_config_digest"
              echo "mcp_attestation_digest=$mcp_attestation_digest"
            } >> "$GITHUB_OUTPUT"
          fi
          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          paths = (
              Path("packages/cardrag-core/pyproject.toml"),
              Path("apps/cardrag-worker/pyproject.toml"),
              Path("apps/cardrag-mcp/pyproject.toml"),
          )
          versions = {tomllib.loads(path.read_text())["project"]["version"] for path in paths}
          assert versions == {expected}, (versions, expected)
          PY
          local_tag_object=$(git rev-parse "refs/tags/v${version}")
          test "$(git rev-parse "refs/tags/v${version}^{commit}")" = "$GITHUB_SHA"
          remote_tag_object=$(git ls-remote origin "refs/tags/v${version}" | awk 'NR == 1 {print $1}')
          remote_tag_commit=$(git ls-remote origin "refs/tags/v${version}^{}" | awk 'NR == 1 {print $1}')
          test -n "$remote_tag_object"
          test -n "$remote_tag_commit"
          test "$remote_tag_object" = "$local_tag_object"
          test "$remote_tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=completed -f per_page=100)
          jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<<"$runs" >/dev/null

  strict-filesystem-scan:
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install checksum-pinned Trivy
        run: |
          set -euo pipefail
          audit_tools_dir="$RUNNER_TEMP/cardrag-release-fs-audit-tools"
          mkdir -p "$audit_tools_dir/trivy-unpack"
          curl --fail --location --silent --show-error \
            --output "$audit_tools_dir/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $audit_tools_dir/trivy.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$audit_tools_dir/trivy.tar.gz" -C "$audit_tools_dir/trivy-unpack"
          install -m 0755 "$audit_tools_dir/trivy-unpack/trivy" "$audit_tools_dir/trivy"
          "$audit_tools_dir/trivy" --version

      - name: Strictly scan the tagged source and sealed evidence checkout
        env:
          CANDIDATE_SOURCE_COMMIT: ${{ needs.validate.outputs.candidate_source_commit }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cardrag-release-fs-audit-tools/trivy" fs \
            --scanners vuln,secret,misconfig \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-filesystem.json \
            .
          "$RUNNER_TEMP/cardrag-release-fs-audit-tools/trivy" --version --format json \
            > trivy-filesystem-version.json
          python - trivy-filesystem-version.json <<'PY'
          import json
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert metadata["Version"] == "0.74.0"
          database = metadata["VulnerabilityDB"]

          def timestamp(name: str) -> datetime:
              value = database[name]
              assert isinstance(value, str) and value.endswith("Z")
              return datetime.fromisoformat(value[:-1] + "+00:00")

          now = datetime.now(UTC)
          updated_at = timestamp("UpdatedAt")
          downloaded_at = timestamp("DownloadedAt")
          assert updated_at <= now + timedelta(minutes=5)
          assert downloaded_at <= now + timedelta(minutes=5)
          assert now - updated_at <= timedelta(hours=36)
          assert now - downloaded_at <= timedelta(hours=2)
          PY
          jq -cnS \
            --arg schema cardrag.strict-filesystem-scan.v1 \
            --arg tag_commit "$GITHUB_SHA" \
            --arg candidate_source_commit "$CANDIDATE_SOURCE_COMMIT" \
            --arg report_sha256 "$(sha256sum trivy-filesystem.json | cut -d' ' -f1)" \
            --arg version_metadata_sha256 \
              "$(sha256sum trivy-filesystem-version.json | cut -d' ' -f1)" \
            --arg db_updated_at \
              "$(jq -r '.VulnerabilityDB.UpdatedAt' trivy-filesystem-version.json)" \
            --arg db_downloaded_at \
              "$(jq -r '.VulnerabilityDB.DownloadedAt' trivy-filesystem-version.json)" \
            '{schema: $schema, tag_commit: $tag_commit,
              candidate_source_commit: $candidate_source_commit,
              scope: "tagged-worktree-and-release-evidence.trivy-default-skips",
              report_sha256: $report_sha256,
              version_metadata_sha256: $version_metadata_sha256,
              db_updated_at: $db_updated_at, db_downloaded_at: $db_downloaded_at,
              scanners: ["vuln", "secret", "misconfig"],
              severities: ["HIGH", "CRITICAL"], ignore_unfixed: false,
              language_dependency_completion: "exact-final-image-scans", result: "passed"}' \
            > strict-filesystem-scan.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strict-filesystem-scan-${{ needs.validate.outputs.version }}
          path: |
            strict-filesystem-scan.json
            trivy-filesystem.json
            trivy-filesystem-version.json
          if-no-files-found: error

  strict-image-scan:
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: [worker, mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the exact candidate package to remain public
        uses: ./.github/actions/verify-public-candidate-package
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install checksum-pinned OCI evidence scanners
        shell: bash
        run: |
          set -euo pipefail
          audit_tools_dir="$RUNNER_TEMP/cardrag-release-audit-tools"
          mkdir -p "$audit_tools_dir/gitleaks-unpack" "$audit_tools_dir/trivy-unpack"
          curl --fail --location --silent --show-error \
            --output "$audit_tools_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error \
            --output "$audit_tools_dir/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_tools_dir/gitleaks.tar.gz" \
            | sha256sum --check --strict
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $audit_tools_dir/trivy.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$audit_tools_dir/gitleaks.tar.gz" -C "$audit_tools_dir/gitleaks-unpack"
          tar -xzf "$audit_tools_dir/trivy.tar.gz" -C "$audit_tools_dir/trivy-unpack"
          install -m 0755 "$audit_tools_dir/gitleaks-unpack/gitleaks" \
            "$audit_tools_dir/gitleaks"
          install -m 0755 "$audit_tools_dir/trivy-unpack/trivy" "$audit_tools_dir/trivy"
          test "$("$audit_tools_dir/gitleaks" version)" = "8.30.1"
          "$audit_tools_dir/trivy" --version

      - name: Install checksum-pinned OCI evidence reader
        run: |
          set -euo pipefail
          registry_tools_dir="$RUNNER_TEMP/cardrag-release-registry-tools"
          mkdir -p "$registry_tools_dir/unpack"
          curl --fail --location --silent --show-error \
            --output "$registry_tools_dir/go-containerregistry.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.22.0/go-containerregistry_Linux_x86_64.tar.gz
          echo "edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833  $registry_tools_dir/go-containerregistry.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$registry_tools_dir/go-containerregistry.tar.gz" \
            -C "$registry_tools_dir/unpack" crane
          install -m 0755 "$registry_tools_dir/unpack/crane" "$registry_tools_dir/crane"
          "$registry_tools_dir/crane" version

      - name: Resolve and validate the exact receipt-bound OCI image anonymously
        id: accepted-image
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.validate.outputs.candidate_source_commit }}
          WORKER_DIGEST: ${{ needs.validate.outputs.worker_digest }}
          WORKER_PLATFORM_DIGEST: ${{ needs.validate.outputs.worker_platform_digest }}
          WORKER_CONFIG_DIGEST: ${{ needs.validate.outputs.worker_config_digest }}
          WORKER_ATTESTATION_DIGEST: ${{ needs.validate.outputs.worker_attestation_digest }}
          MCP_DIGEST: ${{ needs.validate.outputs.mcp_digest }}
          MCP_PLATFORM_DIGEST: ${{ needs.validate.outputs.mcp_platform_digest }}
          MCP_CONFIG_DIGEST: ${{ needs.validate.outputs.mcp_config_digest }}
          MCP_ATTESTATION_DIGEST: ${{ needs.validate.outputs.mcp_attestation_digest }}
        shell: bash
        run: |
          set -euo pipefail
          anonymous_docker_config="$RUNNER_TEMP/cardrag-anonymous-ghcr-docker-config"
          test ! -e "$anonymous_docker_config/config.json"
          install -d -m 0700 "$anonymous_docker_config"
          printf '{"auths":{}}\n' > "$anonymous_docker_config/config.json"
          chmod 0600 "$anonymous_docker_config/config.json"
          export DOCKER_CONFIG="$anonymous_docker_config"
          case "$TARGET" in
            worker)
              digest=$WORKER_DIGEST
              platform_digest=$WORKER_PLATFORM_DIGEST
              config_digest=$WORKER_CONFIG_DIGEST
              attestation_digest=$WORKER_ATTESTATION_DIGEST
              ;;
            mcp)
              digest=$MCP_DIGEST
              platform_digest=$MCP_PLATFORM_DIGEST
              config_digest=$MCP_CONFIG_DIGEST
              attestation_digest=$MCP_ATTESTATION_DIGEST
              ;;
            *) exit 1 ;;
          esac
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$attestation_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${CANDIDATE_IMAGE_REPOSITORY}@${digest}"
          observed_digest=$("$RUNNER_TEMP/cardrag-release-registry-tools/crane" digest "$image")
          test "$observed_digest" = "$digest"
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest "$image" \
            > /tmp/candidate-index.json
          python3 .github/scripts/validate-strict-json.py /tmp/candidate-index.json
          jq -e --arg platform_digest "$platform_digest" \
            --arg attestation_digest "$attestation_digest" \
            -f .github/scripts/validate-candidate-oci-index.jq \
            /tmp/candidate-index.json >/dev/null
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest \
            "${CANDIDATE_IMAGE_REPOSITORY}@${platform_digest}" \
            > /tmp/candidate-platform.json
          python3 .github/scripts/validate-strict-json.py /tmp/candidate-platform.json
          jq -e --arg config_digest "$config_digest" \
            -f .github/scripts/validate-candidate-platform-manifest.jq \
            /tmp/candidate-platform.json >/dev/null
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest \
            "${CANDIDATE_IMAGE_REPOSITORY}@${attestation_digest}" \
            > /tmp/candidate-attestation.json
          python3 .github/scripts/validate-strict-json.py /tmp/candidate-attestation.json
          jq -e --arg platform_digest "$platform_digest" \
            -f .github/scripts/validate-candidate-attestation-manifest.jq \
            /tmp/candidate-attestation.json >/dev/null
          provenance_layer_digest=$(jq -er '
            [.layers[] | select(
              .mediaType == "application/vnd.in-toto+json"
              and .annotations["in-toto.io/predicate-type"]
                == "https://slsa.dev/provenance/v0.2"
            )] | if length == 1 then .[0].digest else error("provenance layer count") end
          ' /tmp/candidate-attestation.json)
          sbom_layer_digest=$(jq -er '
            [.layers[] | select(
              .mediaType == "application/vnd.in-toto+json"
              and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document"
            )] | if length == 1 then .[0].digest else error("SBOM layer count") end
          ' /tmp/candidate-attestation.json)
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" blob \
            "${CANDIDATE_IMAGE_REPOSITORY}@${provenance_layer_digest}" \
            > "provenance-${TARGET}.json"
          test "$(sha256sum "provenance-${TARGET}.json" | cut -d' ' -f1)" = \
            "${provenance_layer_digest#sha256:}"
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" blob \
            "${CANDIDATE_IMAGE_REPOSITORY}@${sbom_layer_digest}" \
            > "sbom-${TARGET}.json"
          test "$(sha256sum "sbom-${TARGET}.json" | cut -d' ' -f1)" = \
            "${sbom_layer_digest#sha256:}"
          python3 .github/scripts/validate-strict-json.py \
            "provenance-${TARGET}.json" "sbom-${TARGET}.json"
          platform_digest_hex=${platform_digest#sha256:}
          source_uri="https://github.com/Kanu-Coffee/MCP_card_prd_detail.git#${CANDIDATE_SOURCE_COMMIT}"
          jq -e \
            --arg source_commit "$CANDIDATE_SOURCE_COMMIT" \
            --arg source_uri "$source_uri" \
            --arg platform_digest_hex "$platform_digest_hex" \
            --arg role "$TARGET" \
            -f .github/scripts/validate-candidate-provenance.jq \
            "provenance-${TARGET}.json" >/dev/null
          jq -e \
            --arg source_commit "$CANDIDATE_SOURCE_COMMIT" \
            --arg role "$TARGET" \
            --arg platform_digest_hex "$platform_digest_hex" \
            -f .github/scripts/validate-candidate-sbom.jq \
            "sbom-${TARGET}.json" >/dev/null
          evidence_secret_scan_dir=$(mktemp -d)
          install -m 0600 "provenance-${TARGET}.json" \
            "$evidence_secret_scan_dir/provenance.json"
          install -m 0600 "sbom-${TARGET}.json" \
            "$evidence_secret_scan_dir/sbom.json"
          "$RUNNER_TEMP/cardrag-release-audit-tools/gitleaks" detect \
            --source "$evidence_secret_scan_dir" \
            --no-git \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path "gitleaks-evidence-${TARGET}.json"
          "$RUNNER_TEMP/cardrag-release-audit-tools/trivy" fs \
            --scanners secret \
            --exit-code 1 \
            --format json \
            --output "trivy-evidence-${TARGET}.json" \
            "$evidence_secret_scan_dir"
          docker pull --platform linux/amd64 "$image" >/dev/null
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
            "$CANDIDATE_SOURCE_COMMIT"
          test "$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = \
            "$VERSION"
          test "$(docker image inspect "$image" --format '{{ json .Config.Entrypoint }}')" = \
            "[\"cardrag-${TARGET}\"]"
          test "$(docker image inspect "$image" --format '{{ .Config.User }}')" = \
            "10001:10001"
          test "$(docker image inspect "$image" --format '{{ .Os }}/{{ .Architecture }}')" = \
            "linux/amd64"
          test "$(docker image inspect "$image" --format '{{ .Id }}')" = "$config_digest"
          {
            echo "image=$image"
            echo "digest=$digest"
            echo "platform_digest=$platform_digest"
            echo "config_digest=$config_digest"
            echo "attestation_digest=$attestation_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Reject every HIGH or CRITICAL image finding, including unfixed findings
        env:
          IMAGE: ${{ steps.accepted-image.outputs.image }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cardrag-release-audit-tools/trivy" image \
            --scanners vuln,secret \
            --platform linux/amd64 \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format json \
            --output "trivy-${TARGET}.json" \
            "$IMAGE"
          "$RUNNER_TEMP/cardrag-release-audit-tools/trivy" --version --format json \
            > "trivy-version-${TARGET}.json"
          python - "trivy-version-${TARGET}.json" <<'PY'
          import json
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert metadata["Version"] == "0.74.0"
          database = metadata["VulnerabilityDB"]

          def timestamp(name: str) -> datetime:
              value = database[name]
              assert isinstance(value, str) and value.endswith("Z")
              return datetime.fromisoformat(value[:-1] + "+00:00")

          now = datetime.now(UTC)
          updated_at = timestamp("UpdatedAt")
          downloaded_at = timestamp("DownloadedAt")
          assert updated_at <= now + timedelta(minutes=5)
          assert downloaded_at <= now + timedelta(minutes=5)
          assert now - updated_at <= timedelta(hours=36)
          assert now - downloaded_at <= timedelta(hours=2)
          PY

      - name: Seal the successful exact-digest scan result
        env:
          DIGEST: ${{ steps.accepted-image.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.accepted-image.outputs.platform_digest }}
          CONFIG_DIGEST: ${{ steps.accepted-image.outputs.config_digest }}
          ATTESTATION_DIGEST: ${{ steps.accepted-image.outputs.attestation_digest }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          jq -cnS \
            --arg schema cardrag.strict-image-scan.v1 \
            --arg role "$TARGET" \
            --arg repository "$CANDIDATE_IMAGE_REPOSITORY" \
            --arg digest "$DIGEST" \
            --arg platform_manifest_digest "$PLATFORM_DIGEST" \
            --arg platform_config_digest "$CONFIG_DIGEST" \
            --arg attestation_manifest_digest "$ATTESTATION_DIGEST" \
            --arg trivy_version 0.74.0 \
            --arg gitleaks_version 8.30.1 \
            --arg db_updated_at "$(jq -r '.VulnerabilityDB.UpdatedAt' \
              "trivy-version-${TARGET}.json")" \
            --arg db_downloaded_at "$(jq -r '.VulnerabilityDB.DownloadedAt' \
              "trivy-version-${TARGET}.json")" \
            --arg report_sha256 "$(sha256sum "trivy-${TARGET}.json" | cut -d' ' -f1)" \
            --arg version_metadata_sha256 \
              "$(sha256sum "trivy-version-${TARGET}.json" | cut -d' ' -f1)" \
            --arg sbom_sha256 "$(sha256sum "sbom-${TARGET}.json" | cut -d' ' -f1)" \
            --arg provenance_sha256 \
              "$(sha256sum "provenance-${TARGET}.json" | cut -d' ' -f1)" \
            --arg evidence_secret_report_sha256 \
              "$(sha256sum "trivy-evidence-${TARGET}.json" | cut -d' ' -f1)" \
            --arg gitleaks_evidence_report_sha256 \
              "$(sha256sum "gitleaks-evidence-${TARGET}.json" | cut -d' ' -f1)" \
            '{schema: $schema, role: $role, repository: $repository,
              digest: $digest, platform_manifest_digest: $platform_manifest_digest,
              platform_config_digest: $platform_config_digest,
              attestation_manifest_digest: $attestation_manifest_digest,
              trivy_version: $trivy_version, gitleaks_version: $gitleaks_version,
              db_updated_at: $db_updated_at, db_downloaded_at: $db_downloaded_at,
              report_sha256: $report_sha256,
              version_metadata_sha256: $version_metadata_sha256,
              sbom_sha256: $sbom_sha256, provenance_sha256: $provenance_sha256,
              evidence_secret_report_sha256: $evidence_secret_report_sha256,
              gitleaks_evidence_report_sha256: $gitleaks_evidence_report_sha256,
              scanners: ["vuln", "secret"], severities: ["HIGH", "CRITICAL"],
              ignore_unfixed: false, result: "passed"}' \
            > "strict-scan-${TARGET}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strict-scan-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            strict-scan-${{ matrix.target }}.json
            trivy-${{ matrix.target }}.json
            trivy-evidence-${{ matrix.target }}.json
            gitleaks-evidence-${{ matrix.target }}.json
            trivy-version-${{ matrix.target }}.json
            sbom-${{ matrix.target }}.json
            provenance-${{ matrix.target }}.json
          if-no-files-found: error

  registry-preflight:
    runs-on: ubuntu-24.04
    needs: [validate, strict-filesystem-scan, strict-image-scan]
    environment: dockerhub-public
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install checksum-pinned OCI digest reader
        run: |
          set -euo pipefail
          registry_tools_dir="$RUNNER_TEMP/cardrag-release-registry-tools"
          mkdir -p "$registry_tools_dir/unpack"
          curl --fail --location --silent --show-error \
            --output "$registry_tools_dir/go-containerregistry.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.22.0/go-containerregistry_Linux_x86_64.tar.gz
          echo "edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833  $registry_tools_dir/go-containerregistry.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$registry_tools_dir/go-containerregistry.tar.gz" \
            -C "$registry_tools_dir/unpack" crane
          install -m 0755 "$registry_tools_dir/unpack/crane" "$registry_tools_dir/crane"
          "$registry_tools_dir/crane" version

      - name: Authenticate for immutable-tag preflight
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker Hub policy and every existing role alias
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.validate.outputs.candidate_source_commit }}
          WORKER_DIGEST: ${{ needs.validate.outputs.worker_digest }}
          WORKER_CONFIG_DIGEST: ${{ needs.validate.outputs.worker_config_digest }}
          MCP_DIGEST: ${{ needs.validate.outputs.mcp_digest }}
          MCP_CONFIG_DIGEST: ${{ needs.validate.outputs.mcp_config_digest }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local reference=$1 observed="" _attempt
            for _attempt in $(seq 1 24); do
              if observed=$("$RUNNER_TEMP/cardrag-release-registry-tools/crane" \
                  digest "$reference" 2>/tmp/crane-error); then
                if [[ "$observed" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$observed"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "registry digest did not become readable for ${reference}" >&2
            cat /tmp/crane-error >&2 || true
            return 1
          }
          pull_linux_amd64() {
            local reference=$1 _attempt
            for _attempt in $(seq 1 24); do
              if docker pull --platform linux/amd64 "$reference" >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "registry image did not become pullable for ${reference}" >&2
            return 1
          }
          validate_image() {
            local reference=$1 role=$2 expected_config=$3 revision version entrypoint user
            local expected_entrypoint
            pull_linux_amd64 "$reference"
            revision=$(docker image inspect "$reference" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            version=$(docker image inspect "$reference" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            entrypoint=$(docker image inspect "$reference" --format '{{ json .Config.Entrypoint }}')
            user=$(docker image inspect "$reference" --format '{{ .Config.User }}')
            expected_entrypoint="[\"cardrag-${role}\"]"
            test "$revision" = "$CANDIDATE_SOURCE_COMMIT"
            test "$version" = "$VERSION"
            test "$entrypoint" = "$expected_entrypoint"
            test "$user" = "10001:10001"
            test "$(docker image inspect "$reference" --format '{{ .Os }}/{{ .Architecture }}')" = \
              "linux/amd64"
            test "$(docker image inspect "$reference" --format '{{ .Id }}')" = "$expected_config"
          }

          repository=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://hub.docker.com/v2/namespaces/ymtop59/repositories/mcp-card-prd-detail")
          jq -e --arg rule "$IMMUTABLE_TAG_RULE" \
            '.immutable_tags_settings.enabled == true
             and .immutable_tags_settings.rules == [$rule]' \
            <<<"$repository" >/dev/null

          for role in worker mcp; do
            case "$role" in
              worker)
                expected_digest=$WORKER_DIGEST
                expected_config=$WORKER_CONFIG_DIGEST
                ;;
              mcp)
                expected_digest=$MCP_DIGEST
                expected_config=$MCP_CONFIG_DIGEST
                ;;
              *) exit 1 ;;
            esac
            [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$expected_config" =~ ^sha256:[0-9a-f]{64}$ ]]
            for tag in "$VERSION-$role" "$VERSION-$role-sha-$SHORT_SHA"; do
              reference="${IMAGE_NAME}:${tag}"
              status=$(curl --silent --show-error --retry 3 --retry-all-errors \
                --output /tmp/dockerhub-tag.json --write-out '%{http_code}' \
                "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")
              case "$status" in
                404) continue ;;
                200) ;;
                *)
                  echo "Docker Hub tag lookup failed for ${reference}: HTTP ${status}" >&2
                  exit 1
                  ;;
              esac
              observed=$(resolve_digest "$reference")
              if [[ "$observed" != "$expected_digest" ]]; then
                echo "immutable alias is not the accepted ${role} digest: ${observed}" >&2
                exit 1
              fi
              validate_image "$reference" "$role" "$expected_config"
            done
          done

  publish:
    runs-on: ubuntu-24.04
    needs: [validate, registry-preflight]
    environment: dockerhub-public
    strategy:
      fail-fast: false
      matrix:
        target: [worker, mcp]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.1.3

      - name: Install checksum-pinned recursive OCI copier
        run: |
          set -euo pipefail
          registry_tools_dir="$RUNNER_TEMP/cardrag-release-registry-tools"
          mkdir -p "$registry_tools_dir/unpack"
          curl --fail --location --silent --show-error \
            --output "$registry_tools_dir/go-containerregistry.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.22.0/go-containerregistry_Linux_x86_64.tar.gz
          echo "edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833  $registry_tools_dir/go-containerregistry.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$registry_tools_dir/go-containerregistry.tar.gz" \
            -C "$registry_tools_dir/unpack" crane
          install -m 0755 "$registry_tools_dir/unpack/crane" "$registry_tools_dir/crane"
          "$registry_tools_dir/crane" version

      - name: Reconfirm the exact candidate package is still public
        uses: ./.github/actions/verify-public-candidate-package
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strict-scan-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: strict-scan

      - name: Download the strict filesystem scan evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strict-filesystem-scan-${{ needs.validate.outputs.version }}
          path: strict-filesystem-scan

      - name: Publish only the receipt-bound and successfully scanned digest
        id: resolved
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.validate.outputs.candidate_source_commit }}
          WORKER_DIGEST: ${{ needs.validate.outputs.worker_digest }}
          WORKER_PLATFORM_DIGEST: ${{ needs.validate.outputs.worker_platform_digest }}
          WORKER_CONFIG_DIGEST: ${{ needs.validate.outputs.worker_config_digest }}
          WORKER_ATTESTATION_DIGEST: ${{ needs.validate.outputs.worker_attestation_digest }}
          MCP_DIGEST: ${{ needs.validate.outputs.mcp_digest }}
          MCP_PLATFORM_DIGEST: ${{ needs.validate.outputs.mcp_platform_digest }}
          MCP_CONFIG_DIGEST: ${{ needs.validate.outputs.mcp_config_digest }}
          MCP_ATTESTATION_DIGEST: ${{ needs.validate.outputs.mcp_attestation_digest }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local reference=$1 observed="" _attempt
            for _attempt in $(seq 1 24); do
              if observed=$("$RUNNER_TEMP/cardrag-release-registry-tools/crane" \
                  digest "$reference" 2>/tmp/crane-error); then
                if [[ "$observed" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$observed"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "registry digest did not become readable for ${reference}" >&2
            cat /tmp/crane-error >&2 || true
            return 1
          }
          case "$TARGET" in
            worker)
              digest=$WORKER_DIGEST
              platform_digest=$WORKER_PLATFORM_DIGEST
              config_digest=$WORKER_CONFIG_DIGEST
              attestation_digest=$WORKER_ATTESTATION_DIGEST
              ;;
            mcp)
              digest=$MCP_DIGEST
              platform_digest=$MCP_PLATFORM_DIGEST
              config_digest=$MCP_CONFIG_DIGEST
              attestation_digest=$MCP_ATTESTATION_DIGEST
              ;;
            *) exit 1 ;;
          esac
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          scan_receipt="strict-scan/strict-scan-${TARGET}.json"
          scan_report="strict-scan/trivy-${TARGET}.json"
          evidence_secret_report="strict-scan/trivy-evidence-${TARGET}.json"
          gitleaks_evidence_report="strict-scan/gitleaks-evidence-${TARGET}.json"
          version_metadata="strict-scan/trivy-version-${TARGET}.json"
          sbom="strict-scan/sbom-${TARGET}.json"
          provenance="strict-scan/provenance-${TARGET}.json"
          scan_report_sha256=$(sha256sum "$scan_report" | cut -d' ' -f1)
          evidence_secret_report_sha256=$(sha256sum "$evidence_secret_report" | cut -d' ' -f1)
          gitleaks_evidence_report_sha256=$(sha256sum "$gitleaks_evidence_report" | cut -d' ' -f1)
          version_metadata_sha256=$(sha256sum "$version_metadata" | cut -d' ' -f1)
          sbom_sha256=$(sha256sum "$sbom" | cut -d' ' -f1)
          provenance_sha256=$(sha256sum "$provenance" | cut -d' ' -f1)
          jq -e 'type == "array" and length == 0' "$gitleaks_evidence_report" >/dev/null
          jq -e '([.Results[]?.Secrets[]?] | length == 0)' \
            "$evidence_secret_report" >/dev/null
          jq -e --arg role "$TARGET" --arg repository "$CANDIDATE_IMAGE_REPOSITORY" \
            --arg digest "$digest" \
            --arg platform_manifest_digest "$platform_digest" \
            --arg platform_config_digest "$config_digest" \
            --arg attestation_manifest_digest "$attestation_digest" \
            --arg report_sha256 "$scan_report_sha256" \
            --arg evidence_secret_report_sha256 "$evidence_secret_report_sha256" \
            --arg gitleaks_evidence_report_sha256 "$gitleaks_evidence_report_sha256" \
            --arg version_metadata_sha256 "$version_metadata_sha256" \
            --arg sbom_sha256 "$sbom_sha256" \
            --arg provenance_sha256 "$provenance_sha256" \
            --arg db_updated_at "$(jq -r '.VulnerabilityDB.UpdatedAt' "$version_metadata")" \
            --arg db_downloaded_at \
              "$(jq -r '.VulnerabilityDB.DownloadedAt' "$version_metadata")" '
            type == "object"
            and (keys == ["attestation_manifest_digest", "db_downloaded_at", "db_updated_at",
              "digest", "evidence_secret_report_sha256", "gitleaks_evidence_report_sha256",
              "gitleaks_version", "ignore_unfixed", "platform_config_digest",
              "platform_manifest_digest", "provenance_sha256", "report_sha256",
              "repository", "result", "role", "sbom_sha256", "scanners", "schema",
              "severities", "trivy_version", "version_metadata_sha256"])
            and .schema == "cardrag.strict-image-scan.v1"
            and .role == $role
            and .repository == $repository
            and .digest == $digest
            and .platform_manifest_digest == $platform_manifest_digest
            and .platform_config_digest == $platform_config_digest
            and .attestation_manifest_digest == $attestation_manifest_digest
            and .trivy_version == "0.74.0"
            and .gitleaks_version == "8.30.1"
            and .db_updated_at == $db_updated_at
            and .db_downloaded_at == $db_downloaded_at
            and .report_sha256 == $report_sha256
            and .evidence_secret_report_sha256 == $evidence_secret_report_sha256
            and .gitleaks_evidence_report_sha256 == $gitleaks_evidence_report_sha256
            and .version_metadata_sha256 == $version_metadata_sha256
            and .sbom_sha256 == $sbom_sha256
            and .provenance_sha256 == $provenance_sha256
            and .scanners == ["vuln", "secret"]
            and .severities == ["HIGH", "CRITICAL"]
            and .ignore_unfixed == false
            and .result == "passed"
          ' "$scan_receipt" >/dev/null
          filesystem_receipt="strict-filesystem-scan/strict-filesystem-scan.json"
          filesystem_report="strict-filesystem-scan/trivy-filesystem.json"
          filesystem_version="strict-filesystem-scan/trivy-filesystem-version.json"
          jq -e \
            --arg tag_commit "$GITHUB_SHA" \
            --arg candidate_source_commit "$CANDIDATE_SOURCE_COMMIT" \
            --arg report_sha256 "$(sha256sum "$filesystem_report" | cut -d' ' -f1)" \
            --arg version_metadata_sha256 \
              "$(sha256sum "$filesystem_version" | cut -d' ' -f1)" \
            --arg db_updated_at "$(jq -r '.VulnerabilityDB.UpdatedAt' "$filesystem_version")" \
            --arg db_downloaded_at \
              "$(jq -r '.VulnerabilityDB.DownloadedAt' "$filesystem_version")" '
            type == "object"
            and .schema == "cardrag.strict-filesystem-scan.v1"
            and .tag_commit == $tag_commit
            and .candidate_source_commit == $candidate_source_commit
            and .scope == "tagged-worktree-and-release-evidence.trivy-default-skips"
            and .report_sha256 == $report_sha256
            and .version_metadata_sha256 == $version_metadata_sha256
            and .db_updated_at == $db_updated_at
            and .db_downloaded_at == $db_downloaded_at
            and .scanners == ["vuln", "secret", "misconfig"]
            and .severities == ["HIGH", "CRITICAL"]
            and .ignore_unfixed == false
            and .language_dependency_completion == "exact-final-image-scans"
            and .result == "passed"
          ' "$filesystem_receipt" >/dev/null
          jq -e '
            ([.Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0)
            and ([.Results[]?.Secrets[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0)
            and ([.Results[]?.Misconfigurations[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0)
          ' "$filesystem_report" >/dev/null
          python - "$version_metadata" <<'PY'
          import json
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert metadata["Version"] == "0.74.0"
          database = metadata["VulnerabilityDB"]

          def timestamp(name: str) -> datetime:
              value = database[name]
              assert isinstance(value, str) and value.endswith("Z")
              return datetime.fromisoformat(value[:-1] + "+00:00")

          now = datetime.now(UTC)
          updated_at = timestamp("UpdatedAt")
          downloaded_at = timestamp("DownloadedAt")
          assert updated_at <= now + timedelta(minutes=5)
          assert downloaded_at <= now + timedelta(minutes=5)
          assert now - updated_at <= timedelta(hours=36)
          assert now - downloaded_at <= timedelta(hours=2)
          PY
          python - "$filesystem_version" <<'PY'
          import json
          import sys
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert metadata["Version"] == "0.74.0"
          database = metadata["VulnerabilityDB"]

          def timestamp(name: str) -> datetime:
              value = database[name]
              assert isinstance(value, str) and value.endswith("Z")
              return datetime.fromisoformat(value[:-1] + "+00:00")

          now = datetime.now(UTC)
          updated_at = timestamp("UpdatedAt")
          downloaded_at = timestamp("DownloadedAt")
          assert updated_at <= now + timedelta(minutes=5)
          assert downloaded_at <= now + timedelta(minutes=5)
          assert now - updated_at <= timedelta(hours=36)
          assert now - downloaded_at <= timedelta(hours=2)
          PY
          source_reference="${CANDIDATE_IMAGE_REPOSITORY}@${digest}"
          test "$(resolve_digest "$source_reference")" = "$digest"
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest \
            "${CANDIDATE_IMAGE_REPOSITORY}@${platform_digest}" \
            > /tmp/source-platform.json
          python3 .github/scripts/validate-strict-json.py /tmp/source-platform.json
          jq -e --arg config_digest "$config_digest" \
            -f .github/scripts/validate-candidate-platform-manifest.jq \
            /tmp/source-platform.json >/dev/null
          docker pull --platform linux/amd64 "$source_reference" >/dev/null
          test "$(docker image inspect "$source_reference" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
            "$CANDIDATE_SOURCE_COMMIT"
          test "$(docker image inspect "$source_reference" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = \
            "$VERSION"
          test "$(docker image inspect "$source_reference" \
            --format '{{ json .Config.Entrypoint }}')" = "[\"cardrag-${TARGET}\"]"
          test "$(docker image inspect "$source_reference" --format '{{ .Config.User }}')" = \
            "10001:10001"
          test "$(docker image inspect "$source_reference" --format '{{ .Id }}')" = "$config_digest"

          test "$(git cat-file -t "refs/tags/v$VERSION")" = tag
          local_tag_object=$(git rev-parse "refs/tags/v${VERSION}")
          test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$GITHUB_SHA"
          remote_tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}")
          test "$(jq -r '.object.type' <<<"$remote_tag_ref")" = tag
          remote_tag_object=$(jq -r '.object.sha' <<<"$remote_tag_ref")
          test "$remote_tag_object" = "$local_tag_object"
          remote_tag=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${remote_tag_object}")
          test "$(jq -r '.object.type' <<<"$remote_tag")" = commit
          remote_tag_commit=$(jq -r '.object.sha' <<<"$remote_tag")
          test "$remote_tag_commit" = "$GITHUB_SHA"
          repository=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://hub.docker.com/v2/namespaces/ymtop59/repositories/mcp-card-prd-detail")
          jq -e --arg rule "$IMMUTABLE_TAG_RULE" \
            '.immutable_tags_settings.enabled == true
             and .immutable_tags_settings.rules == [$rule]' \
            <<<"$repository" >/dev/null

          for tag in "$VERSION-$TARGET" "$VERSION-$TARGET-sha-$SHORT_SHA"; do
            reference="${IMAGE_NAME}:${tag}"
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output /tmp/dockerhub-tag.json --write-out '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")
            case "$status" in
              404)
                "$RUNNER_TEMP/cardrag-release-registry-tools/crane" copy \
                  "$source_reference" "$reference"
                ;;
              200)
                test "$(resolve_digest "$reference")" = "$digest"
                ;;
              *)
                echo "Docker Hub tag lookup failed for ${reference}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
            test "$(resolve_digest "$reference")" = "$digest"
          done
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest \
            "${IMAGE_NAME}@${digest}" \
            > /tmp/published-index.json
          python3 .github/scripts/validate-strict-json.py /tmp/published-index.json
          jq -e --arg platform_digest "$platform_digest" \
            --arg attestation_digest "$attestation_digest" \
            -f .github/scripts/validate-candidate-oci-index.jq \
            /tmp/published-index.json >/dev/null
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest \
            "${IMAGE_NAME}@${platform_digest}" > /tmp/published-platform.json
          python3 .github/scripts/validate-strict-json.py /tmp/published-platform.json
          jq -e --arg config_digest "$config_digest" \
            -f .github/scripts/validate-candidate-platform-manifest.jq \
            /tmp/published-platform.json >/dev/null
          cmp --silent /tmp/source-platform.json /tmp/published-platform.json
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" manifest \
            "${IMAGE_NAME}@${attestation_digest}" > /tmp/published-attestation.json
          python3 .github/scripts/validate-strict-json.py /tmp/published-attestation.json
          jq -e --arg platform_digest "$platform_digest" \
            -f .github/scripts/validate-candidate-attestation-manifest.jq \
            /tmp/published-attestation.json >/dev/null
          published_provenance_digest=$(jq -er '
            [.layers[] | select(
              .annotations["in-toto.io/predicate-type"]
                == "https://slsa.dev/provenance/v0.2"
            )] | if length == 1 then .[0].digest else error("provenance layer count") end
          ' /tmp/published-attestation.json)
          published_sbom_digest=$(jq -er '
            [.layers[] | select(
              .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document"
            )] | if length == 1 then .[0].digest else error("SBOM layer count") end
          ' /tmp/published-attestation.json)
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" blob \
            "${IMAGE_NAME}@${published_provenance_digest}" > /tmp/published-provenance.json
          "$RUNNER_TEMP/cardrag-release-registry-tools/crane" blob \
            "${IMAGE_NAME}@${published_sbom_digest}" > /tmp/published-sbom.json
          cmp --silent "$provenance" /tmp/published-provenance.json
          cmp --silent "$sbom" /tmp/published-sbom.json
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${digest}" >/dev/null
          test "$(docker image inspect "${IMAGE_NAME}@${digest}" --format '{{ .Id }}')" = \
            "$config_digest"
          {
            echo "digest=$digest"
            echo "platform_digest=$platform_digest"
            echo "config_digest=$config_digest"
            echo "attestation_digest=$attestation_digest"
            echo "scan_receipt_sha256=$(sha256sum "$scan_receipt" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure and verify exact-source keyless signature
        id: signature
        env:
          DIGEST: ${{ steps.resolved.outputs.digest }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          reference="${IMAGE_NAME}@${DIGEST}"
          expected_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          verify_signature() {
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$expected_identity" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --check-claims=true \
              --timeout 15s \
              --output json \
              "$reference"
          }
          if ! verify_signature >/tmp/cosign-verification.json \
              2>/tmp/cosign-verification-error; then
            if ! cosign sign --yes --timeout 30s "$reference"; then
              echo "cosign sign returned nonzero; checking for a completed signature" >&2
            fi
          fi
          verified=false
          for _attempt in $(seq 1 12); do
            if verify_signature >/tmp/cosign-verification.json \
                2>/tmp/cosign-verification-error; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            cat /tmp/cosign-verification-error >&2 || true
            exit 1
          fi
          verified_subject="index.docker.io/${IMAGE_NAME}@${DIGEST}"
          jq -e --arg digest "$DIGEST" --arg subject "$verified_subject" '
            type == "array"
            and length > 0
            and all(.[];
              .critical.identity["docker-reference"] == $subject
              and .critical.image["docker-manifest-digest"] == $digest
              and .critical.type == "https://sigstore.dev/cosign/sign/v1"
            )
          ' /tmp/cosign-verification.json >/dev/null
          jq -S . /tmp/cosign-verification.json > "cosign-${TARGET}.json"
          echo "sha256=$(sha256sum "cosign-${TARGET}.json" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Record role digest
        env:
          DIGEST: ${{ steps.resolved.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.resolved.outputs.platform_digest }}
          CONFIG_DIGEST: ${{ steps.resolved.outputs.config_digest }}
          ATTESTATION_DIGEST: ${{ steps.resolved.outputs.attestation_digest }}
          SCAN_RECEIPT_SHA256: ${{ steps.resolved.outputs.scan_receipt_sha256 }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.validate.outputs.candidate_source_commit }}
          SIGNATURE_SHA256: ${{ steps.signature.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          role = os.environ["TARGET"]
          digest = os.environ["DIGEST"]
          scan_receipt_path = Path("strict-scan") / f"strict-scan-{role}.json"
          scan_receipt = json.loads(scan_receipt_path.read_text(encoding="utf-8"))
          assert scan_receipt["role"] == role
          assert scan_receipt["digest"] == digest
          assert scan_receipt["platform_manifest_digest"] == os.environ["PLATFORM_DIGEST"]
          assert scan_receipt["platform_config_digest"] == os.environ["CONFIG_DIGEST"]
          assert scan_receipt["attestation_manifest_digest"] == os.environ[
              "ATTESTATION_DIGEST"
          ]
          manifest = {
              "schema": "cardrag.container-release-part.v5",
              "role": role,
              "version": os.environ["VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "candidate_source_commit": os.environ["CANDIDATE_SOURCE_COMMIT"],
              "candidate_image_repository": os.environ["CANDIDATE_IMAGE_REPOSITORY"],
              "image": os.environ["IMAGE_NAME"],
              "digest": digest,
              "platform_manifest_digest": os.environ["PLATFORM_DIGEST"],
              "platform_config_digest": os.environ["CONFIG_DIGEST"],
              "attestation_manifest_digest": os.environ["ATTESTATION_DIGEST"],
              "platforms": ["linux/amd64"],
              "tags": [
                  f'{os.environ["VERSION"]}-{role}',
                  f'{os.environ["VERSION"]}-{role}-sha-{os.environ["SHORT_SHA"]}',
              ],
              "workflow": os.environ["GITHUB_WORKFLOW_REF"],
              "strict_scan": {
                  "receipt_path": scan_receipt_path.as_posix(),
                  "receipt_sha256": os.environ["SCAN_RECEIPT_SHA256"],
                  "report_path": f"strict-scan/trivy-{role}.json",
                  "report_sha256": scan_receipt["report_sha256"],
                  "evidence_secret_report_path": f"strict-scan/trivy-evidence-{role}.json",
                  "evidence_secret_report_sha256": scan_receipt[
                      "evidence_secret_report_sha256"
                  ],
                  "gitleaks_evidence_report_path": f"strict-scan/gitleaks-evidence-{role}.json",
                  "gitleaks_evidence_report_sha256": scan_receipt[
                      "gitleaks_evidence_report_sha256"
                  ],
                  "gitleaks_version": scan_receipt["gitleaks_version"],
                  "version_metadata_path": f"strict-scan/trivy-version-{role}.json",
                  "version_metadata_sha256": scan_receipt["version_metadata_sha256"],
                  "sbom_path": f"strict-scan/sbom-{role}.json",
                  "sbom_sha256": scan_receipt["sbom_sha256"],
                  "provenance_path": f"strict-scan/provenance-{role}.json",
                  "provenance_sha256": scan_receipt["provenance_sha256"],
                  "db_updated_at": scan_receipt["db_updated_at"],
                  "db_downloaded_at": scan_receipt["db_downloaded_at"],
              },
              "signature": {
                  "kind": "github-actions-oidc-keyless-cosign",
                  "evidence_path": f"cosign-{role}.json",
                  "evidence_sha256": os.environ["SIGNATURE_SHA256"],
                  "subject": f'index.docker.io/{os.environ["IMAGE_NAME"]}@{digest}',
                  "certificate_oidc_issuer": "https://token.actions.githubusercontent.com",
                  "certificate_identity": f'https://github.com/{os.environ["GITHUB_WORKFLOW_REF"]}',
                  "github_workflow_sha": os.environ["GITHUB_SHA"],
              },
          }
          Path(f"release-{role}.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            release-${{ matrix.target }}.json
            cosign-${{ matrix.target }}.json
            strict-scan/strict-scan-${{ matrix.target }}.json
            strict-scan/trivy-${{ matrix.target }}.json
            strict-scan/trivy-evidence-${{ matrix.target }}.json
            strict-scan/gitleaks-evidence-${{ matrix.target }}.json
            strict-scan/trivy-version-${{ matrix.target }}.json
            strict-scan/sbom-${{ matrix.target }}.json
            strict-scan/provenance-${{ matrix.target }}.json
          if-no-files-found: error
          overwrite: true

  release:
    runs-on: ubuntu-24.04
    needs: [validate, publish, strict-filesystem-scan]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download Worker release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.validate.outputs.version }}-worker
          path: release-parts

      - name: Download MCP release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.validate.outputs.version }}-mcp
          path: release-parts

      - name: Download strict filesystem scan evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: strict-filesystem-scan-${{ needs.validate.outputs.version }}
          path: release-parts/filesystem

      - name: Revalidate tag and assemble deterministic release metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.validate.outputs.candidate_source_commit }}
          WORKER_DIGEST: ${{ needs.validate.outputs.worker_digest }}
          WORKER_PLATFORM_DIGEST: ${{ needs.validate.outputs.worker_platform_digest }}
          WORKER_CONFIG_DIGEST: ${{ needs.validate.outputs.worker_config_digest }}
          WORKER_ATTESTATION_DIGEST: ${{ needs.validate.outputs.worker_attestation_digest }}
          MCP_DIGEST: ${{ needs.validate.outputs.mcp_digest }}
          MCP_PLATFORM_DIGEST: ${{ needs.validate.outputs.mcp_platform_digest }}
          MCP_CONFIG_DIGEST: ${{ needs.validate.outputs.mcp_config_digest }}
          MCP_ATTESTATION_DIGEST: ${{ needs.validate.outputs.mcp_attestation_digest }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/v$VERSION")" = tag
          local_tag_object=$(git rev-parse "refs/tags/v${VERSION}")
          test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$GITHUB_SHA"
          remote_tag_object=$(git ls-remote origin "refs/tags/v${VERSION}" | awk 'NR == 1 {print $1}')
          remote_tag_commit=$(git ls-remote origin "refs/tags/v${VERSION}^{}" | awk 'NR == 1 {print $1}')
          test -n "$remote_tag_object"
          test -n "$remote_tag_commit"
          test "$remote_tag_object" = "$local_tag_object"
          test "$remote_tag_commit" = "$GITHUB_SHA"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path("release-parts")
          role_paths = [source / f"release-{role}.json" for role in ("worker", "mcp")]
          assert all(path.is_file() for path in role_paths), role_paths
          parts = [json.loads(path.read_text(encoding="utf-8")) for path in role_paths]
          roles = {part["role"]: part for part in parts}
          expected_roles = {"worker", "mcp"}
          assert len(parts) == 2, role_paths
          assert set(roles) == expected_roles, roles
          assert all(part["schema"] == "cardrag.container-release-part.v5" for part in parts)
          assert all(part["version"] == os.environ["VERSION"] for part in parts)
          assert all(part["git_sha"] == os.environ["GITHUB_SHA"] for part in parts)
          assert all(
              part["candidate_source_commit"] == os.environ["CANDIDATE_SOURCE_COMMIT"]
              for part in parts
          )
          assert all(part["image"] == os.environ["IMAGE_NAME"] for part in parts)
          assert all(
              part["candidate_image_repository"] == os.environ["CANDIDATE_IMAGE_REPOSITORY"]
              for part in parts
          )
          assert all(part["workflow"] == os.environ["GITHUB_WORKFLOW_REF"] for part in parts)
          assert len({part["digest"] for part in parts}) == 2

          assets = Path("release-assets")
          assets.mkdir()
          filesystem_source = source / "filesystem"
          filesystem_receipt_path = filesystem_source / "strict-filesystem-scan.json"
          filesystem_report_path = filesystem_source / "trivy-filesystem.json"
          filesystem_version_path = filesystem_source / "trivy-filesystem-version.json"
          filesystem_receipt = json.loads(
              filesystem_receipt_path.read_text(encoding="utf-8")
          )
          assert filesystem_receipt["schema"] == "cardrag.strict-filesystem-scan.v1"
          assert filesystem_receipt["tag_commit"] == os.environ["GITHUB_SHA"]
          assert filesystem_receipt["candidate_source_commit"] == (
              os.environ["CANDIDATE_SOURCE_COMMIT"]
          )
          assert filesystem_receipt["scope"] == (
              "tagged-worktree-and-release-evidence.trivy-default-skips"
          )
          assert filesystem_receipt["scanners"] == ["vuln", "secret", "misconfig"]
          assert filesystem_receipt["severities"] == ["HIGH", "CRITICAL"]
          assert filesystem_receipt["ignore_unfixed"] is False
          assert filesystem_receipt["language_dependency_completion"] == (
              "exact-final-image-scans"
          )
          assert filesystem_receipt["result"] == "passed"
          assert hashlib.sha256(filesystem_report_path.read_bytes()).hexdigest() == (
              filesystem_receipt["report_sha256"]
          )
          assert hashlib.sha256(filesystem_version_path.read_bytes()).hexdigest() == (
              filesystem_receipt["version_metadata_sha256"]
          )
          filesystem_version = json.loads(
              filesystem_version_path.read_text(encoding="utf-8")
          )
          assert filesystem_version["Version"] == "0.74.0"
          assert filesystem_version["VulnerabilityDB"]["UpdatedAt"] == (
              filesystem_receipt["db_updated_at"]
          )
          assert filesystem_version["VulnerabilityDB"]["DownloadedAt"] == (
              filesystem_receipt["db_downloaded_at"]
          )
          filesystem_scan = {
              "receipt_path": filesystem_receipt_path.name,
              "receipt_sha256": hashlib.sha256(
                  filesystem_receipt_path.read_bytes()
              ).hexdigest(),
              "report_path": filesystem_report_path.name,
              "report_sha256": filesystem_receipt["report_sha256"],
              "version_metadata_path": filesystem_version_path.name,
              "version_metadata_sha256": filesystem_receipt["version_metadata_sha256"],
              "db_updated_at": filesystem_receipt["db_updated_at"],
              "db_downloaded_at": filesystem_receipt["db_downloaded_at"],
          }
          for filesystem_path in (
              filesystem_receipt_path,
              filesystem_report_path,
              filesystem_version_path,
          ):
              (assets / filesystem_path.name).write_bytes(filesystem_path.read_bytes())
          for role, part in roles.items():
              assert part["digest"] == os.environ[f"{role.upper()}_DIGEST"], role
              assert part["platform_manifest_digest"] == os.environ[
                  f"{role.upper()}_PLATFORM_DIGEST"
              ], role
              assert part["platform_config_digest"] == os.environ[
                  f"{role.upper()}_CONFIG_DIGEST"
              ], role
              assert part["attestation_manifest_digest"] == os.environ[
                  f"{role.upper()}_ATTESTATION_DIGEST"
              ], role
              assert part["platforms"] == ["linux/amd64"], role
              assert part["tags"] == [
                  f'{os.environ["VERSION"]}-{role}',
                  f'{os.environ["VERSION"]}-{role}-sha-{os.environ["SHORT_SHA"]}',
              ], role
              signature = part["signature"]
              assert signature["kind"] == "github-actions-oidc-keyless-cosign", role
              assert signature["github_workflow_sha"] == os.environ["GITHUB_SHA"], role
              assert signature["certificate_oidc_issuer"] == (
                  "https://token.actions.githubusercontent.com"
              ), role
              assert signature["certificate_identity"] == (
                  f'https://github.com/{os.environ["GITHUB_WORKFLOW_REF"]}'
              ), role
              assert signature["subject"] == (
                  f'index.docker.io/{os.environ["IMAGE_NAME"]}@{part["digest"]}'
              ), role
              evidence = source / signature["evidence_path"]
              assert evidence.is_file(), role
              assert hashlib.sha256(evidence.read_bytes()).hexdigest() == (
                  signature["evidence_sha256"]
              ), role
              verified = json.loads(evidence.read_text(encoding="utf-8"))
              assert isinstance(verified, list) and verified, role
              assert all(
                  item["critical"]["identity"]["docker-reference"] == signature["subject"]
                  and item["critical"]["image"]["docker-manifest-digest"] == part["digest"]
                  and item["critical"]["type"] == "https://sigstore.dev/cosign/sign/v1"
                  for item in verified
              ), role
              strict_scan = part["strict_scan"]
              scan_receipt_path = source / strict_scan["receipt_path"]
              scan_report_path = source / strict_scan["report_path"]
              evidence_secret_report_path = source / strict_scan[
                  "evidence_secret_report_path"
              ]
              gitleaks_evidence_report_path = source / strict_scan[
                  "gitleaks_evidence_report_path"
              ]
              version_metadata_path = source / strict_scan["version_metadata_path"]
              sbom_path = source / strict_scan["sbom_path"]
              provenance_path = source / strict_scan["provenance_path"]
              for scan_path, expected_sha256 in (
                  (scan_receipt_path, strict_scan["receipt_sha256"]),
                  (scan_report_path, strict_scan["report_sha256"]),
                  (
                      evidence_secret_report_path,
                      strict_scan["evidence_secret_report_sha256"],
                  ),
                  (
                      gitleaks_evidence_report_path,
                      strict_scan["gitleaks_evidence_report_sha256"],
                  ),
                  (version_metadata_path, strict_scan["version_metadata_sha256"]),
                  (sbom_path, strict_scan["sbom_sha256"]),
                  (provenance_path, strict_scan["provenance_sha256"]),
              ):
                  assert scan_path.is_file(), (role, scan_path)
                  assert hashlib.sha256(scan_path.read_bytes()).hexdigest() == expected_sha256
              scan_receipt = json.loads(scan_receipt_path.read_text(encoding="utf-8"))
              assert scan_receipt["role"] == role
              assert scan_receipt["repository"] == os.environ["CANDIDATE_IMAGE_REPOSITORY"]
              assert scan_receipt["digest"] == part["digest"]
              assert scan_receipt["result"] == "passed"
              assert scan_receipt["ignore_unfixed"] is False
              assert scan_receipt["gitleaks_version"] == strict_scan["gitleaks_version"]
              assert scan_receipt["gitleaks_version"] == "8.30.1"
              assert scan_receipt["db_updated_at"] == strict_scan["db_updated_at"]
              assert scan_receipt["db_downloaded_at"] == strict_scan["db_downloaded_at"]
              (assets / f"release-{role}.json").write_bytes(
                  (source / f"release-{role}.json").read_bytes()
              )
              (assets / f"cosign-{role}.json").write_bytes(evidence.read_bytes())
              for scan_path in (
                  scan_receipt_path,
                  scan_report_path,
                  evidence_secret_report_path,
                  gitleaks_evidence_report_path,
                  version_metadata_path,
                  sbom_path,
                  provenance_path,
              ):
                  (assets / scan_path.name).write_bytes(scan_path.read_bytes())

          manifest = {
              "schema": "cardrag.container-release.v5",
              "version": os.environ["VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "candidate_source_commit": os.environ["CANDIDATE_SOURCE_COMMIT"],
              "candidate_image_repository": os.environ["CANDIDATE_IMAGE_REPOSITORY"],
              "image": os.environ["IMAGE_NAME"],
              "workflow": os.environ["GITHUB_WORKFLOW_REF"],
              "strict_filesystem_scan": filesystem_scan,
              "roles": {role: roles[role] for role in ("worker", "mcp")},
          }
          (assets / "release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          notes = [
              f"CardRAG v{os.environ['VERSION']} Worker/MCP 단순화 런타임 릴리스입니다.",
              "",
              "이미지(immutable digest):",
              "",
          ]
          for role in ("worker", "mcp"):
              notes.append(f"- {role}: `{os.environ['IMAGE_NAME']}@{roles[role]['digest']}`")
          notes.extend(
              [
                  "",
                  f"Git commit: `{os.environ['GITHUB_SHA']}`",
                  f"Candidate source commit: `{os.environ['CANDIDATE_SOURCE_COMMIT']}`",
                  "",
                  "첨부된 `release-manifest.json`, 역할별 manifest, strict image/filesystem "
                  "Trivy/Gitleaks JSON 및 DB metadata, Cosign 검증 결과와 `SHA256SUMS`에서 게시 증거를 "
                  "확인할 수 있습니다.",
              ]
          )
          Path("release-notes.md").write_text("\n".join(notes) + "\n", encoding="utf-8")
          PY

          (
            cd release-assets
            sha256sum \
              cosign-mcp.json \
              cosign-worker.json \
              release-manifest.json \
              release-mcp.json \
              release-worker.json \
              provenance-mcp.json \
              provenance-worker.json \
              gitleaks-evidence-mcp.json \
              gitleaks-evidence-worker.json \
              sbom-mcp.json \
              sbom-worker.json \
              strict-scan-mcp.json \
              strict-scan-worker.json \
              strict-filesystem-scan.json \
              trivy-filesystem.json \
              trivy-filesystem-version.json \
              trivy-evidence-mcp.json \
              trivy-evidence-worker.json \
              trivy-mcp.json \
              trivy-version-mcp.json \
              trivy-version-worker.json \
              trivy-worker.json > SHA256SUMS
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.validate.outputs.version }}-manifest
          path: release-assets
          if-no-files-found: error
          overwrite: true

      - name: Create or safely repair the GitHub Release for this immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=(
            release-assets/release-manifest.json
            release-assets/release-worker.json
            release-assets/release-mcp.json
            release-assets/cosign-worker.json
            release-assets/cosign-mcp.json
            release-assets/sbom-worker.json
            release-assets/sbom-mcp.json
            release-assets/provenance-worker.json
            release-assets/provenance-mcp.json
            release-assets/gitleaks-evidence-worker.json
            release-assets/gitleaks-evidence-mcp.json
            release-assets/strict-scan-worker.json
            release-assets/strict-scan-mcp.json
            release-assets/strict-filesystem-scan.json
            release-assets/trivy-filesystem.json
            release-assets/trivy-filesystem-version.json
            release-assets/trivy-evidence-worker.json
            release-assets/trivy-evidence-mcp.json
            release-assets/trivy-worker.json
            release-assets/trivy-mcp.json
            release-assets/trivy-version-worker.json
            release-assets/trivy-version-mcp.json
            release-assets/SHA256SUMS
          )
          (cd release-assets && sha256sum --check SHA256SUMS)
          release_lookup="$RUNNER_TEMP/cardrag-release-lookup.json"
          release_json="$RUNNER_TEMP/cardrag-release.json"
          release_owner=${GITHUB_REPOSITORY%%/*}
          release_repo=${GITHUB_REPOSITORY#*/}
          expected_assets=$(
            for asset in "${assets[@]}"; do
              digest=$(sha256sum "$asset" | awk '{print $1}')
              jq -cn \
                --arg name "$(basename "$asset")" \
                --arg digest "sha256:${digest}" \
                '{name: $name, digest: $digest}'
            done | jq -s 'sort_by(.name)'
          )

          lookup_release() {
            local query
            # GraphQL variables are intentionally literal for gh to bind with -F.
            # shellcheck disable=SC2016
            query='query($owner:String!,$repo:String!,$tag:String!){repository(owner:$owner,name:$repo){release(tagName:$tag){databaseId tagName}}}'
            gh api graphql \
              -f query="$query" \
              -F owner="$release_owner" \
              -F repo="$release_repo" \
              -F tag="$tag" > "$release_lookup"
          }

          release_id_from_lookup() {
            jq -r --arg tag "$tag" '
              .data.repository.release
              | select(.tagName == $tag)
              | .databaseId // empty
            ' "$release_lookup"
          }

          load_release() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/$1" > "$release_json"
          }

          refresh_release() {
            local release_id
            lookup_release
            release_id=$(release_id_from_lookup)
            if [[ -z "$release_id" ]]; then
              return 1
            fi
            load_release "$release_id"
          }

          verify_remote_release() {
            local expected_draft=$1
            local _attempt
            for _attempt in $(seq 1 12); do
              if refresh_release \
                  && jq -e \
                    --arg tag "$tag" \
                    --arg expected_name "CardRAG ${tag}" \
                    --rawfile expected_body release-notes.md \
                    --argjson expected_draft "$expected_draft" \
                    --argjson expected_assets "$expected_assets" '
                      .tag_name == $tag
                      and .name == $expected_name
                      and .body == $expected_body
                      and .draft == $expected_draft
                      and .prerelease == false
                      and ([.assets[] | {name, digest}] | sort_by(.name)) == $expected_assets
                      and all(.assets[]; .state == "uploaded")
                    ' "$release_json" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          # Only a successful GraphQL lookup returning null proves absence. Network,
          # authorization, or schema failures stop the job before any mutation.
          lookup_release
          release_id=$(release_id_from_lookup)
          if [[ -n "$release_id" ]]; then
            load_release "$release_id"
            if jq -e '.draft == false' "$release_json" >/dev/null; then
              if ! verify_remote_release false; then
                echo "::error::existing public release is partial or differs; refusing mutation"
                exit 1
              fi
              echo "Existing public release is exact; no mutation required."
              exit 0
            fi
            jq -e --arg tag "$tag" '.tag_name == $tag and .draft == true' \
              "$release_json" >/dev/null
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --title "CardRAG ${tag}" \
              --notes-file release-notes.md
          fi

          # Drafts are safe to repair destructively: an interrupted upload stays unpublished,
          # and a same-run retry can reconstruct the exact asset set deterministically.
          refresh_release
          jq -e --arg tag "$tag" \
            '.tag_name == $tag and .draft == true and .prerelease == false' \
            "$release_json" >/dev/null
          mapfile -t existing_asset_ids < <(jq -r '.assets[].id' "$release_json")
          for asset_id in "${existing_asset_ids[@]}"; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

          gh release edit "$tag" \
            --verify-tag \
            --title "CardRAG ${tag}" \
            --notes-file release-notes.md \
            --draft=true \
            --prerelease=false
          gh release upload "$tag" "${assets[@]}"
          verify_remote_release true
          gh release edit "$tag" \
            --verify-tag \
            --title "CardRAG ${tag}" \
            --notes-file release-notes.md \
            --draft=false \
            --prerelease=false \
            --latest

      - name: Verify published GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          assets=(
            release-assets/release-manifest.json
            release-assets/release-worker.json
            release-assets/release-mcp.json
            release-assets/cosign-worker.json
            release-assets/cosign-mcp.json
            release-assets/sbom-worker.json
            release-assets/sbom-mcp.json
            release-assets/provenance-worker.json
            release-assets/provenance-mcp.json
            release-assets/gitleaks-evidence-worker.json
            release-assets/gitleaks-evidence-mcp.json
            release-assets/strict-scan-worker.json
            release-assets/strict-scan-mcp.json
            release-assets/strict-filesystem-scan.json
            release-assets/trivy-filesystem.json
            release-assets/trivy-filesystem-version.json
            release-assets/trivy-evidence-worker.json
            release-assets/trivy-evidence-mcp.json
            release-assets/trivy-worker.json
            release-assets/trivy-mcp.json
            release-assets/trivy-version-worker.json
            release-assets/trivy-version-mcp.json
            release-assets/SHA256SUMS
          )
          (cd release-assets && sha256sum --check SHA256SUMS)
          release_view="$RUNNER_TEMP/cardrag-release-view.json"
          expected_assets=$(
            for asset in "${assets[@]}"; do
              digest=$(sha256sum "$asset" | awk '{print $1}')
              jq -cn \
                --arg name "$(basename "$asset")" \
                --arg digest "sha256:${digest}" \
                '{name: $name, digest: $digest}'
            done | jq -s 'sort_by(.name)'
          )
          gh release view "$tag" \
            --json apiUrl,isDraft,isPrerelease,tagName > "$release_view"
          release_api=$(jq -er --arg tag "$tag" \
            'select(.tagName == $tag) | .apiUrl' "$release_view")
          gh api "$release_api" \
            | jq -e \
                --arg tag "$tag" \
                --arg expected_name "CardRAG ${tag}" \
                --rawfile expected_body release-notes.md \
                --argjson expected_assets "$expected_assets" '
                  .tag_name == $tag
                  and .name == $expected_name
                  and .body == $expected_body
                  and .draft == false
                  and .prerelease == false
                  and ([.assets[] | {name, digest}] | sort_by(.name)) == $expected_assets
                  and all(.assets[]; .state == "uploaded")
                ' >/dev/null
