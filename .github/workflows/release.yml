name: Public image release
run-name: Publish v${{ inputs.version }} role images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing SemVer tag without the leading v"
        required: true
        type: string
      confirmation:
        description: "Enter PUBLISH-vX.Y.Z to authorize the public push"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: public-dockerhub-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ymtop59/mcp-card-prd-detail
  IMMUTABLE_TAG_RULE: '^[0-9]+\.[0-9]+\.[0-9]+-(mcp|worker|admin)(-sha-[0-9a-f]{12})?$'

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate immutable SemVer release tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          version=$REQUESTED_VERSION
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version input must be exactly X.Y.Z" >&2
            exit 1
          fi
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          test "$RELEASE_CONFIRMATION" = "PUBLISH-v$version"
          project_version=$(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )
          if [[ "$project_version" != "$version" ]]; then
            echo "pyproject.toml version $project_version does not match release $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Require successful full CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f per_page=100)
          if ! jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<<"$runs" >/dev/null; then
            echo "the exact release commit has no successful full CI workflow run" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test release source
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv lock --check
          uv sync --frozen --extra dev
          uv run --no-sync ruff check .
          uv run --no-sync mypy src/cardrag
          uv run --no-sync pytest -m "not integration and not live and not load"
          uv run --no-sync python scripts/run_fixture_quality.py \
            --output /tmp/cardrag-fixture-quality.json
          uv run --no-sync pytest -m load
          uv run --no-sync python scripts/run_local_load.py \
            --output /tmp/cardrag-local-load.json
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/monitoring:/monitoring:ro" \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /monitoring/cardrag-alerts.yml

  release-approval:
    runs-on: ubuntu-24.04
    needs: validate
    environment: dockerhub-public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Revalidate exact dependency licenses after manual release authorization
        run: |
          python -m pip install --disable-pip-version-check uv==0.8.17
          uv sync --frozen --extra dev
          uv run --no-sync python scripts/check_dependency_licenses.py \
            --release \
            --output release-dependency-licenses.json
          jq -e \
            '.status == "passed"
             and .manual_review_required == []
             and ([.manual_review_resolved[].name] | sort)
                 == (["certifi", "psycopg", "psycopg-binary", "psycopg-pool", "pypdfium2"] | sort)' \
            release-dependency-licenses.json >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-license-${{ needs.validate.outputs.version }}
          path: release-dependency-licenses.json
          if-no-files-found: error

  registry-preflight:
    runs-on: ubuntu-24.04
    needs: [validate, release-approval]
    environment: dockerhub-public
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate for an all-role immutable-tag preflight
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reject any existing role tag from another source revision
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local reference=$1 observed="" _attempt
            for _attempt in $(seq 1 24); do
              if observed=$(docker buildx imagetools inspect "$reference" 2>/tmp/imagetools-error \
                  | awk '$1 == "Digest:" {print $2; exit}'); then
                if [[ "$observed" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$observed"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "registry digest did not become readable for ${reference}" >&2
            cat /tmp/imagetools-error >&2 || true
            return 1
          }
          pull_linux_amd64() {
            local reference=$1 _attempt
            for _attempt in $(seq 1 24); do
              if docker pull --platform linux/amd64 "$reference" >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "registry image did not become pullable for ${reference}" >&2
            return 1
          }
          repository=$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://hub.docker.com/v2/namespaces/ymtop59/repositories/mcp-card-prd-detail")
          if ! jq -e \
            --arg rule "$IMMUTABLE_TAG_RULE" \
            '.immutable_tags_settings.enabled == true
             and .immutable_tags_settings.rules == [$rule]' \
            <<<"$repository" >/dev/null; then
            echo "Docker Hub SemVer role-tag immutability does not match policy" >&2
            exit 1
          fi
          for role in mcp worker admin; do
            digest=""
            for tag in "$VERSION-$role" "$VERSION-$role-sha-$SHORT_SHA"; do
              reference="${IMAGE_NAME}:${tag}"
              status=$(curl --silent --show-error --retry 3 --retry-all-errors \
                --output /tmp/dockerhub-tag.json --write-out '%{http_code}' \
                "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")
              case "$status" in
                404) continue ;;
                200) ;;
                *)
                  echo "Docker Hub tag lookup failed for ${reference}: HTTP ${status}" >&2
                  exit 1
                  ;;
              esac
              observed=$(resolve_digest "$reference")
              pull_linux_amd64 "$reference"
              revision=$(docker image inspect "$reference" \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
              if [[ "$revision" != "$GITHUB_SHA" ]]; then
                echo "refusing to overwrite ${reference}; it belongs to ${revision:-unknown}" >&2
                exit 1
              fi
              if [[ -n "$digest" && "$digest" != "$observed" ]]; then
                echo "role tags disagree for ${role}: ${digest} != ${observed}" >&2
                exit 1
              fi
              digest=$observed
            done
          done

  publish:
    runs-on: ubuntu-24.04
    needs: [validate, release-approval, registry-preflight]
    environment: dockerhub-public
    strategy:
      fail-fast: false
      matrix:
        target: [mcp, worker, admin]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: v3.1.3

      - name: Authenticate to Docker Hub after environment approval
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reuse only an immutable partial release from this exact commit
        id: existing
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local reference=$1 observed="" _attempt
            for _attempt in $(seq 1 24); do
              if observed=$(docker buildx imagetools inspect "$reference" 2>/tmp/imagetools-error \
                  | awk '$1 == "Digest:" {print $2; exit}'); then
                if [[ "$observed" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$observed"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "registry digest did not become readable for ${reference}" >&2
            cat /tmp/imagetools-error >&2 || true
            return 1
          }
          pull_linux_amd64() {
            local reference=$1 _attempt
            for _attempt in $(seq 1 24); do
              if docker pull --platform linux/amd64 "$reference" >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "registry image did not become pullable for ${reference}" >&2
            return 1
          }
          digest=""
          for tag in "$VERSION-$TARGET" "$VERSION-$TARGET-sha-$SHORT_SHA"; do
            reference="${IMAGE_NAME}:${tag}"
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output /tmp/dockerhub-tag.json --write-out '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")
            case "$status" in
              404) continue ;;
              200) ;;
              *)
                echo "Docker Hub tag lookup failed for ${reference}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
            observed=$(resolve_digest "$reference")
            pull_linux_amd64 "$reference"
            revision=$(docker image inspect "$reference" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "refusing to overwrite ${reference}; it belongs to ${revision:-unknown}" >&2
              exit 1
            fi
            if [[ -n "$digest" && "$digest" != "$observed" ]]; then
              echo "role tags disagree: ${digest} != ${observed}" >&2
              exit 1
            fi
            digest=$observed
          done
          if [[ -n "$digest" ]]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push public linux/amd64 role image
        id: build
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-${{ matrix.target }}
            ${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}-${{ matrix.target }}-sha-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=CardRAG ${{ matrix.target }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Restore a missing alias after an interrupted matching release
        if: steps.existing.outputs.reuse == 'true'
        env:
          DIGEST: ${{ steps.existing.outputs.digest }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "$VERSION-$TARGET" "$VERSION-$TARGET-sha-$SHORT_SHA"; do
            reference="${IMAGE_NAME}:${tag}"
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output /tmp/dockerhub-tag.json --write-out '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")
            case "$status" in
              404)
              docker buildx imagetools create \
                --tag "$reference" \
                "${IMAGE_NAME}@${DIGEST}"
                ;;
              200) ;;
              *)
                echo "Docker Hub tag lookup failed for ${reference}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          done

      - name: Resolve the immutable role digest
        id: resolved
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          REUSED: ${{ steps.existing.outputs.reuse }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REUSED" = true ]]; then
            digest=$EXISTING_DIGEST
          else
            digest=$BUILT_DIGEST
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify both immutable role aliases resolve to the selected digest
        env:
          DIGEST: ${{ steps.resolved.outputs.digest }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local reference=$1 observed="" _attempt
            for _attempt in $(seq 1 24); do
              if observed=$(docker buildx imagetools inspect "$reference" 2>/tmp/imagetools-error \
                  | awk '$1 == "Digest:" {print $2; exit}'); then
                if [[ "$observed" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$observed"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "registry digest did not become readable for ${reference}" >&2
            cat /tmp/imagetools-error >&2 || true
            return 1
          }
          for tag in "$VERSION-$TARGET" "$VERSION-$TARGET-sha-$SHORT_SHA"; do
            reference="${IMAGE_NAME}:${tag}"
            status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --output /tmp/dockerhub-tag.json --write-out '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}")
            test "$status" = 200
            observed=$(resolve_digest "$reference")
            if [[ "$observed" != "$DIGEST" ]]; then
              echo "immutable alias mismatch for ${reference}: ${observed:-missing}" >&2
              exit 1
            fi
          done

      - name: Validate the dependency-license record embedded in the role image
        id: image_license
        env:
          DIGEST: ${{ steps.resolved.outputs.digest }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          reference="${IMAGE_NAME}@${DIGEST}"
          pulled=false
          for _attempt in $(seq 1 24); do
            if docker pull --platform linux/amd64 "$reference" >/dev/null 2>&1; then
              pulled=true
              break
            fi
            sleep 5
          done
          if [[ "$pulled" != true ]]; then
            echo "registry image did not become pullable for ${reference}" >&2
            exit 1
          fi
          revision=$(docker image inspect "$reference" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$GITHUB_SHA"
          container=$(docker create --platform linux/amd64 "$reference")
          trap 'docker rm "$container" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "$container:/usr/share/licenses/cardrag/dependency-license-manifest.json" \
            "image-license-${TARGET}.json"
          jq -e \
            '.status == "passed"
             and .mode == "release-notices-only"
             and .manual_review_required == []
             and ([.manual_review_resolved[].name] | sort)
                 == (["certifi", "psycopg", "psycopg-binary", "psycopg-pool", "pypdfium2"] | sort)
             and ([.license_payloads[] | select(.name == "pypdfium2") | .files | length] == [19])' \
            "image-license-${TARGET}.json" >/dev/null
          echo "sha256=$(sha256sum "image-license-${TARGET}.json" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Ensure and verify keyless OCI signature with GitHub Actions OIDC
        id: signature
        env:
          COSIGN_VERSION: v3.1.3
          DIGEST: ${{ steps.resolved.outputs.digest }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          reference="${IMAGE_NAME}@${DIGEST}"
          evidence="cosign-${TARGET}.verification.json"
          expected_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          test "$(cosign version --json | jq -er '.gitVersion')" = "$COSIGN_VERSION"
          verify_signature() {
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$expected_identity" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --check-claims=true \
              --timeout 15s \
              --output json \
              "$reference"
          }
          if ! verify_signature > /tmp/cosign-verification.json \
              2>/tmp/cosign-verification-error; then
            cosign sign --yes "$reference"
          fi
          verified=false
          for _attempt in $(seq 1 12); do
            if verify_signature > /tmp/cosign-verification.json \
                2>/tmp/cosign-verification-error; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            cat /tmp/cosign-verification-error >&2 || true
            exit 1
          fi
          jq -e --arg digest "$DIGEST" --arg subject "$reference" '
            type == "array"
            and length > 0
            and all(.[];
              .critical.identity["docker-reference"] == $subject
              and
              .critical.image["docker-manifest-digest"] == $digest
              and .critical.type == "https://sigstore.dev/cosign/sign/v1"
            )
          ' /tmp/cosign-verification.json >/dev/null
          jq -S . /tmp/cosign-verification.json > "$evidence"
          echo "sha256=$(sha256sum "$evidence" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Record immutable release manifest
        env:
          DIGEST: ${{ steps.resolved.outputs.digest }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          IMAGE_LICENSE_SHA256: ${{ steps.image_license.outputs.sha256 }}
          SIGNATURE_EVIDENCE_SHA256: ${{ steps.signature.outputs.sha256 }}
          COSIGN_VERSION: v3.1.3
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema": "cardrag.container-release-part.v3",
              "role": os.environ["TARGET"],
              "image": os.environ["IMAGE_NAME"],
              "digest": os.environ["DIGEST"],
              "version": os.environ["VERSION"],
              "git_sha": os.environ["GITHUB_SHA"],
              "platforms": ["linux/amd64"],
              "tags": [
                  f'{os.environ["VERSION"]}-{os.environ["TARGET"]}',
                  f'{os.environ["VERSION"]}-{os.environ["TARGET"]}-sha-{os.environ["SHORT_SHA"]}',
              ],
              "signature": "github-actions-oidc-keyless-cosign",
              "signature_evidence": {
                  "path": f'cosign-{os.environ["TARGET"]}.verification.json',
                  "sha256": os.environ["SIGNATURE_EVIDENCE_SHA256"],
                  "subject": f'{os.environ["IMAGE_NAME"]}@{os.environ["DIGEST"]}',
                  "certificate_oidc_issuer": "https://token.actions.githubusercontent.com",
                  "certificate_identity": f'https://github.com/{os.environ["GITHUB_WORKFLOW_REF"]}',
                  "github_workflow_sha": os.environ["GITHUB_SHA"],
                  "cosign_version": os.environ["COSIGN_VERSION"],
                  "check_claims": True,
              },
              "embedded_dependency_license_manifest": {
                  "path": f'image-license-{os.environ["TARGET"]}.json',
                  "sha256": os.environ["IMAGE_LICENSE_SHA256"],
              },
              "workflow": os.environ["GITHUB_WORKFLOW_REF"],
          }
          Path(f'release-manifest-{os.environ["TARGET"]}.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-part-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: |
            release-manifest-${{ matrix.target }}.json
            cosign-${{ matrix.target }}.verification.json
            image-license-${{ matrix.target }}.json
          if-no-files-found: error

  publish-manifest:
    runs-on: ubuntu-24.04
    needs: [validate, publish]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-part-${{ needs.validate.outputs.version }}-*
          path: release-parts
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-license-${{ needs.validate.outputs.version }}
          path: release-license

      - name: Assemble all role digests and signature evidence
        env:
          COSIGN_VERSION: v3.1.3
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-parts")
          parts = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(root.glob("release-manifest-*.json"))
          ]
          roles = {part["role"]: part for part in parts}
          assert len(parts) == 3, parts
          assert set(roles) == {"mcp", "worker", "admin"}, roles
          assert all(part["schema"] == "cardrag.container-release-part.v3" for part in parts)
          assert all(part["image"] == os.environ["IMAGE_NAME"] for part in parts)
          assert all(part["version"] == os.environ["VERSION"] for part in parts)
          assert all(part["git_sha"] == os.environ["GIT_SHA"] for part in parts)
          assert all(part["workflow"] == os.environ["GITHUB_WORKFLOW_REF"] for part in parts)
          assert len({part["digest"] for part in parts}) == 3
          for role, part in roles.items():
              assert part["platforms"] == ["linux/amd64"]
              assert part["tags"] == [
                  f'{os.environ["VERSION"]}-{role}',
                  f'{os.environ["VERSION"]}-{role}-sha-{os.environ["GIT_SHA"][:12]}',
              ], role
              expected_subject = f'{os.environ["IMAGE_NAME"]}@{part["digest"]}'
              expected_identity = f'https://github.com/{os.environ["GITHUB_WORKFLOW_REF"]}'
              assert part["signature_evidence"]["subject"] == expected_subject, role
              assert part["signature_evidence"]["certificate_oidc_issuer"] == (
                  "https://token.actions.githubusercontent.com"
              ), role
              assert part["signature_evidence"]["certificate_identity"] == expected_identity, role
              assert part["signature_evidence"]["github_workflow_sha"] == os.environ["GIT_SHA"], role
              assert part["signature_evidence"]["cosign_version"] == os.environ["COSIGN_VERSION"], role
              assert part["signature_evidence"]["check_claims"] is True, role
              signature_evidence = root / part["signature_evidence"]["path"]
              assert signature_evidence.is_file(), role
              assert hashlib.sha256(signature_evidence.read_bytes()).hexdigest() == (
                  part["signature_evidence"]["sha256"]
              ), role
              verified_signatures = json.loads(signature_evidence.read_text(encoding="utf-8"))
              assert isinstance(verified_signatures, list) and verified_signatures, role
              assert all(
                  signature["critical"]["identity"]["docker-reference"] == expected_subject
                  and
                  signature["critical"]["image"]["docker-manifest-digest"] == part["digest"]
                  and signature["critical"]["type"] == "https://sigstore.dev/cosign/sign/v1"
                  for signature in verified_signatures
              ), role
              image_license = root / part["embedded_dependency_license_manifest"]["path"]
              assert image_license.is_file(), role
              assert hashlib.sha256(image_license.read_bytes()).hexdigest() == (
                  part["embedded_dependency_license_manifest"]["sha256"]
              ), role
              embedded = json.loads(image_license.read_text(encoding="utf-8"))
              assert embedded["status"] == "passed", role
              assert embedded["manual_review_required"] == [], role
              assert {item["name"] for item in embedded["manual_review_resolved"]} == {
                  "certifi",
                  "psycopg",
                  "psycopg-binary",
                  "psycopg-pool",
                  "pypdfium2",
              }, role

          license_path = Path("release-license/release-dependency-licenses.json")
          license_report = json.loads(license_path.read_text(encoding="utf-8"))
          assert license_report["status"] == "passed"
          assert license_report["manual_review_required"] == []
          assert {item["name"] for item in license_report["manual_review_resolved"]} == {
              "certifi",
              "psycopg",
              "psycopg-binary",
              "psycopg-pool",
              "pypdfium2",
          }

          manifest = {
              "schema": "cardrag.container-release.v3",
              "image": os.environ["IMAGE_NAME"],
              "version": os.environ["VERSION"],
              "git_sha": parts[0]["git_sha"],
              "workflow": parts[0]["workflow"],
              "dependency_license_report": {
                  "path": "release-dependency-licenses.json",
                  "sha256": hashlib.sha256(license_path.read_bytes()).hexdigest(),
                  "resolved_reviews": sorted(
                      item["name"]
                      for item in license_report["manual_review_resolved"]
                  ),
              },
              "roles": {role: roles[role] for role in ("mcp", "worker", "admin")},
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ needs.validate.outputs.version }}
          path: |
            release-manifest.json
            release-parts/cosign-*.verification.json
            release-parts/image-license-*.json
            release-license/release-dependency-licenses.json
          if-no-files-found: error
