[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardrag-legacy"
version = "0.2.1"
description = "Read-only v0.2.1 compatibility package retained during the v1 shadow cutover"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Proprietary"}
authors = [{name = "CardRAG maintainers"}]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "cryptography>=50,<51",
  "httpx>=0.28,<1",
  "lxml>=5.4,<7",
  "mcp==2.0.0",
  "numpy>=2.2,<3",
  "Pillow>=12,<13",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.22,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pypdfium2==5.12.1",
  "python-json-logger>=3.3,<5",
  "tenacity>=9.1,<10",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5,<2",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pypdf>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
cardrag-legacy = "cardrag.cli:app"
cardrag-legacy-mcp = "cardrag.app:main"
cardrag-legacy-worker = "cardrag.worker:main"

[tool.uv.workspace]
members = [
  "packages/cardrag-core",
  "apps/cardrag-worker",
  "apps/cardrag-mcp",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cardrag"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires Docker or an external PostgreSQL instance",
  "load: deterministic local load or performance test",
  "live: requires an external issuer/provider account or network",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["cardrag-conveyor-hatch-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = [
  "E501", # Ruff formatter cannot safely reflow SQL/prompt literals.
  "S101", # Assertions are required throughout the test suite.
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cardrag"]
exclude = ["cardrag-conveyor-hatch-.*"]
