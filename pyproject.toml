[tool.uv.workspace]
members = [
  "packages/cardrag-core",
  "apps/cardrag-worker",
  "apps/cardrag-mcp",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pypdf>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = [
  "packages/cardrag-core/tests",
  "apps/cardrag-worker/tests",
  "apps/cardrag-mcp/tests",
  "tests/runtime_v1",
]
pythonpath = [
  "packages/cardrag-core/src",
  "apps/cardrag-worker/src",
  "apps/cardrag-mcp/src",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = [
  "E501", # Ruff formatter cannot safely reflow SQL/prompt literals.
  "S101", # Assertions are required throughout the test suite.
]

[tool.mypy]
python_version = "3.12"
strict = true
